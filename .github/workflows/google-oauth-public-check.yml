name: Check public Google OAuth client IDs
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/google-oauth-public-check.yml'
jobs:
  check-google-oauth-ids:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Compare public Google OAuth authorization responses
        shell: bash
        run: |
          python3 - <<'PY'
          import urllib.error
          import urllib.parse
          import urllib.request

          project = "498363735983-nka03bna11698m7o6"
          suffix = "l7vnga8fb80e.apps.googleusercontent.com"
          for label, middle in (
              ("copied_from_google_cloud", "aool"),
              ("previous_jarvis_configuration", "ao0l"),
              ("known_invalid_control", "zzzz"),
          ):
              client_id = project + middle + suffix
              params = urllib.parse.urlencode({
                  "client_id": client_id,
                  "response_type": "code",
                  "redirect_uri": "https://example.com/jarvis-credential-check",
                  "scope": "openid email",
                  "state": "public-client-id-check",
              })
              endpoint = "https://accounts.google.com/o/oauth2/v2/auth?" + params
              try:
                  req = urllib.request.Request(endpoint, headers={
                      "User-Agent": "Mozilla/5.0 JARVIS OAuth configuration check",
                  })
                  with urllib.request.urlopen(req, timeout=20) as result:
                      status, body = result.status, result.read(200000).decode("utf-8", "replace")
              except urllib.error.HTTPError as error:
                  status, body = error.code, error.read(200000).decode("utf-8", "replace")
              except Exception as exc:
                  print(f"{label}: network failure {type(exc).__name__}")
                  continue
              lower = body.lower()
              invalid = any(part in lower for part in (
                  "invalid_client", "client was not found", "oauth client was not found",
                  "unknown client", "deleted oauth client",
              ))
              mismatch = any(part in lower for part in (
                  "redirect_uri_mismatch", "redirect uri mismatch", "redirect_uri",
                  "doesn't comply with google", "not authorized for this client",
              ))
              print(f"{label}: HTTP={status}; invalid_client_markers={invalid}; redirect_markers={mismatch}")
          PY
      - name: Smoke-test deployed Chairman email verification (no email sent)
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          base = "https://jarvis-legal-enterprise-api.onrender.com"
          tests = [
              ("GET", "/health", None, 200),
              ("GET", "/v1/auth/email/start", None, 405),
              # Valid request schema, invalid proof. A 422 here proves the
              # backend has the publishable key and validates proofs.
              # A 503 means email fallback was not correctly configured.
              ("POST", "/v1/auth/email/verify", {"proof": "notvalidlink"}, 422),
          ]
          for method, path, payload, expected in tests:
              data = json.dumps(payload).encode() if payload else None
              request = urllib.request.Request(
                  base + path, method=method, data=data,
                  headers={"Content-Type": "application/json"},
              )
              for attempt in range(8):
                  try:
                      with urllib.request.urlopen(request, timeout=30) as result:
                          status = result.status
                  except urllib.error.HTTPError as exc:
                      status = exc.code
                  except Exception as exc:
                      status = 0
                  if status == expected:
                      print(f"PASS {method} {path}: HTTP {status}")
                      break
                  if attempt == 7:
                      raise SystemExit(
                          f"FAIL {method} {path}: expected HTTP {expected}, got {status}"
                      )
                  time.sleep(8)
          PY
