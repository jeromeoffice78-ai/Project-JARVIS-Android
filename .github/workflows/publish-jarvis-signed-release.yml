name: Publish Signed JARVIS AI Assistant

on:
  workflow_run:
    workflows:
      - JARVIS Legal Enterprise Chairman Production APK
    types: [completed]
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/publish-jarvis-signed-release.yml'

permissions:
  contents: write
  actions: read

env:
  ARTIFACT_NAME: JARVIS-AI-ASSISTANT-FINAL-ARM64
  EXPECTED_SIGNING_CERT_SHA256: 004905e15f747bc9a635366138c01357b1c06615dfe6f3c3af9d3b1d52c1187f
  EXPECTED_SIGNING_CERT_SHA1: 3996f2adfb2ee33497d764c22944a8c8784fc64e
  EXPECTED_PACKAGE: com.jarvis.project_jarvis

jobs:
  publish:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Resolve verified production-signed Android run
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          EVENT_RUN_ID: ${{ github.event.workflow_run.id }}
          EVENT_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
          EVENT_RUN_NUMBER: ${{ github.event.workflow_run.run_number }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_run" ]]; then
            RUN_ID="$EVENT_RUN_ID"
            HEAD_SHA="$EVENT_HEAD_SHA"
            RUN_NUMBER="$EVENT_RUN_NUMBER"
          else
            RUN_JSON="$(gh run list \
              --workflow jarvis-legal-enterprise.yml \
              --status success \
              --limit 1 \
              --json databaseId,headSha,number \
              --jq '.[0]')"
            RUN_ID="$(jq -r '.databaseId' <<<"$RUN_JSON")"
            HEAD_SHA="$(jq -r '.headSha' <<<"$RUN_JSON")"
            RUN_NUMBER="$(jq -r '.number' <<<"$RUN_JSON")"
          fi

          test -n "$RUN_ID"
          test -n "$HEAD_SHA"
          test -n "$RUN_NUMBER"
          git cat-file -e "$HEAD_SHA^{commit}"

          VERSION_LINE="$(git show "$HEAD_SHA:jarvis_app/pubspec.yaml" | awk '/^version:/ {print $2; exit}')"
          test -n "$VERSION_LINE"
          VERSION="${VERSION_LINE%%+*}"
          TAG="jarvis-ai-assistant-signed-v${VERSION}-build-${RUN_NUMBER}"

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "sha=$HEAD_SHA" >> "$GITHUB_OUTPUT"
          echo "number=$RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - name: Download production-signed JARVIS APK
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.source.outputs.run_id }}
        run: |
          set -euo pipefail
          mkdir -p dist
          gh run download "$RUN_ID" --name "$ARTIFACT_NAME" --dir dist

      - name: Verify signature, package, identity and SHA-256
        shell: bash
        run: |
          set -euo pipefail
          test -s dist/JARVIS-AI-ASSISTANT-FINAL-ARM64.apk
          test -s dist/JARVIS-AI-ASSISTANT-FINAL-ARM64.apk.sha256
          test -s dist/OAUTH-ANDROID-IDENTITY.txt
          (
            cd dist
            sed 's#assistant_dist/##g' JARVIS-AI-ASSISTANT-FINAL-ARM64.apk.sha256 |
              sha256sum --check --strict -
          )
          grep -Fx "ANDROID_PACKAGE=$EXPECTED_PACKAGE" dist/OAUTH-ANDROID-IDENTITY.txt
          SHA1_WITH_COLONS="$(echo "$EXPECTED_SIGNING_CERT_SHA1" | sed 's/../&:/g;s/:$//')"
          grep -Fix "SIGNING_SHA1=$SHA1_WITH_COLONS" dist/OAUTH-ANDROID-IDENTITY.txt

          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -n "$APKSIGNER"
          test -n "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs dist/JARVIS-AI-ASSISTANT-FINAL-ARM64.apk |
            tee dist/apk-signature.txt
          grep -Fi "certificate SHA-256 digest: $EXPECTED_SIGNING_CERT_SHA256" dist/apk-signature.txt
          "$AAPT" dump badging dist/JARVIS-AI-ASSISTANT-FINAL-ARM64.apk |
            tee dist/badging.txt
          grep -F "package: name='$EXPECTED_PACKAGE'" dist/badging.txt
          grep -F "native-code: 'arm64-v8a'" dist/badging.txt

      - name: Publish production-signed JARVIS release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.source.outputs.tag }}
          HEAD_SHA: ${{ steps.source.outputs.sha }}
          RUN_NUMBER: ${{ steps.source.outputs.number }}
          VERSION: ${{ steps.source.outputs.version }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release view "$TAG" --json assets \
              --jq '.assets[].name' |
              grep -Fx 'JARVIS-AI-ASSISTANT-FINAL-ARM64.apk'
            echo "Verified signed JARVIS release already exists: $TAG"
            exit 0
          fi

          gh release create "$TAG" \
            dist/JARVIS-AI-ASSISTANT-FINAL-ARM64.apk \
            dist/JARVIS-AI-ASSISTANT-FINAL-ARM64.apk.sha256 \
            dist/OAUTH-ANDROID-IDENTITY.txt \
            --target "$HEAD_SHA" \
            --title "JARVIS AI Assistant v${VERSION} • Production Signed (Build ${RUN_NUMBER})" \
            --notes "Verified permanent-signature JARVIS Android ARM64 release. Google Sign-In requires an Android OAuth client in the same Google project as the web server client ID, registered for package com.jarvis.project_jarvis and this APK's SHA-1 fingerprint. The old JARVIS-v1.3-debug APK is not a production sign-in build."
