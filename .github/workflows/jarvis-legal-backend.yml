name: JARVIS Legal Backend CI

on:
  push:
    branches: [main]
    paths:
      - 'legal_backend/**'
      - '.github/workflows/jarvis-legal-backend.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: legal_backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: legal_backend/requirements.txt
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run API tests
        env:
          PYTHONPATH: .
          OPENAI_API_KEY: test-openai-key
          JARVIS_CHAIRMAN_TOKEN: test-chairman-token
          JARVIS_CLIENT_TOKEN: test-client-token
        run: pytest -q
      - name: Build Docker image
        run: docker build -t jarvis-legal-backend:test .
