name: Build Compact JARVIS Release APKs

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-compact-jarvis-release.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-release:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android scaffold and native bridges
        working-directory: jarvis_app
        run: |
          set -euo pipefail
          flutter create --platforms=android .
          rm -f test/widget_test.dart
          python scripts/prepare_native.py

      - name: Bundle standalone Jarvis 3D model
        working-directory: jarvis_app
        run: |
          set -euo pipefail
          mkdir -p assets/models
          curl --fail --location --retry 5 --retry-delay 3 \
            https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/CesiumMan/glTF-Binary/CesiumMan.glb \
            --output assets/models/CesiumMan.glb
          test "$(stat -c %s assets/models/CesiumMan.glb)" -eq 438044

      - name: Bundle local Three.js avatar runtime
        working-directory: jarvis_app
        run: |
          set -euo pipefail
          mkdir -p assets/vendor/three/addons/loaders assets/vendor/three/addons/utils
          curl --fail --location --retry 5 --retry-delay 3 \
            https://raw.githubusercontent.com/mrdoob/three.js/r180/build/three.module.js \
            --output assets/vendor/three/three.module.js
          curl --fail --location --retry 5 --retry-delay 3 \
            https://raw.githubusercontent.com/mrdoob/three.js/r180/examples/jsm/loaders/GLTFLoader.js \
            --output assets/vendor/three/addons/loaders/GLTFLoader.js
          curl --fail --location --retry 5 --retry-delay 3 \
            https://raw.githubusercontent.com/mrdoob/three.js/r180/examples/jsm/utils/BufferGeometryUtils.js \
            --output assets/vendor/three/addons/utils/BufferGeometryUtils.js
          test -s assets/vendor/three/three.module.js
          test -s assets/vendor/three/addons/loaders/GLTFLoader.js
          test -s assets/vendor/three/addons/utils/BufferGeometryUtils.js

      - name: Bundle photoreal human Jarvis assets
        working-directory: jarvis_app
        run: |
          set -euo pipefail
          mkdir -p assets/models
          curl --fail --location --retry 5 --retry-delay 3 \
            https://raw.githubusercontent.com/ibrews/VitruvianGodot/main/godot_project/vitruvian_body.glb \
            --output assets/models/vitruvian_body.glb
          curl --fail --location --retry 5 --retry-delay 3 \
            https://raw.githubusercontent.com/ibrews/VitruvianGodot/main/godot_project/vitruvian_head.glb \
            --output assets/models/vitruvian_head.glb
          curl --fail --location --retry 5 --retry-delay 3 \
            https://raw.githubusercontent.com/ibrews/VitruvianGodot/main/godot_project/hairtool_cards.glb \
            --output assets/models/hairtool_cards.glb
          for asset in vit_face_bc.png vit_mouth.png vit_sclera.png vit_iris.png vit_hair_atlas.png vit_hair_opacity.png; do
            curl --fail --location --retry 5 --retry-delay 3 \
              "https://raw.githubusercontent.com/ibrews/VitruvianGodot/main/godot_project/$asset" \
              --output "assets/models/$asset"
          done
          test "$(stat -c %s assets/models/vitruvian_body.glb)" -eq 6879364
          test "$(stat -c %s assets/models/vitruvian_head.glb)" -eq 10189832
          test "$(stat -c %s assets/models/hairtool_cards.glb)" -eq 14839096

      - name: Bundle on-device speaker identity model
        working-directory: jarvis_app
        run: |
          set -euo pipefail
          mkdir -p assets/models
          curl --fail --location --retry 5 --retry-delay 3 \
            "https://huggingface.co/mlboydaisuke/ECAPA-TDNN-Speaker-ExecuTorch/resolve/main/speaker_ecapa_xnnpack_fp32.pte?download=true" \
            --output assets/models/speaker_ecapa_xnnpack_fp32.pte
          test "$(stat -c %s assets/models/speaker_ecapa_xnnpack_fp32.pte)" -gt 80000000

      - name: Install Flutter packages
        working-directory: jarvis_app
        run: flutter pub get

      - name: Analyze
        working-directory: jarvis_app
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Build release APKs split per CPU
        working-directory: jarvis_app
        env:
          JARVIS_HTTP_BASE: ${{ vars.JARVIS_HTTP_BASE }}
          JARVIS_WS_URL: ${{ vars.JARVIS_WS_URL }}
          JARVIS_CLIENT_TOKEN: ${{ secrets.JARVIS_CLIENT_TOKEN }}
        run: |
          set -euo pipefail
          HTTP_BASE="${JARVIS_HTTP_BASE:-https://project-jarvis-android.onrender.com}"
          WS_URL="${JARVIS_WS_URL:-wss://project-jarvis-android.onrender.com/ws/jarvis}"
          TOKEN="${JARVIS_CLIENT_TOKEN:-}"
          flutter build apk --release --split-per-abi \
            --dart-define=JARVIS_HTTP_BASE="$HTTP_BASE" \
            --dart-define=JARVIS_WS_URL="$WS_URL" \
            --dart-define=JARVIS_CLIENT_TOKEN="$TOKEN"

      - name: Stage compact APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp jarvis_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/JARVIS-FULL-APP-ARM64.apk
          cp jarvis_app/build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/JARVIS-FULL-APP-ARM32.apk
          if [ -f jarvis_app/build/app/outputs/flutter-apk/app-x86_64-release.apk ]; then
            cp jarvis_app/build/app/outputs/flutter-apk/app-x86_64-release.apk dist/JARVIS-FULL-APP-X86_64.apk
          fi
          sha256sum dist/*.apk | tee dist/SHA256SUMS.txt
          ls -lh dist

      - name: Publish compact release APKs
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="jarvis-compact-full-v1.3.0"
          TITLE="JARVIS Full App - Compact Release"
          NOTES="Full JARVIS Android app built in release mode and split by CPU architecture to reduce download size. For most modern Android phones/tablets, use JARVIS-FULL-APP-ARM64.apk."
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/*.apk dist/SHA256SUMS.txt --clobber
          else
            gh release create "$TAG" dist/*.apk dist/SHA256SUMS.txt \
              --target "${GITHUB_SHA}" \
              --title "$TITLE" \
              --notes "$NOTES"
          fi
