name: JARVIS Legal Enterprise Chairman READY APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'legal_app/**'
      - '.github/workflows/jarvis-legal-enterprise.yml'

permissions:
  contents: read
  id-token: write

env:
  JARVIS_HTTP_BASE: https://jarvis-watch-bridge.floot.app
  JARVIS_SIGNING_CERT_SHA256: 004905e15f747bc9a635366138c01357b1c06615dfe6f3c3af9d3b1d52c1187f

jobs:
  build-chairman-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Retrieve permanent Chairman signing identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/jarvis_signing
          OIDC_JSON="$(curl -fsSL \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=jarvis-legal-android-signing")"
          OIDC_TOKEN="$(OIDC_JSON="$OIDC_JSON" python - <<'PY'
          import json, os
          payload = json.loads(os.environ['OIDC_JSON'])
          token = payload.get('value', '')
          if not token:
              raise SystemExit('GitHub OIDC token was not returned.')
          print(token)
          PY
          )"
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            "${JARVIS_HTTP_BASE}/_api/v1/internal/android-signing" \
            -o /tmp/jarvis_signing/identity.json
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          payload = json.loads(Path('/tmp/jarvis_signing/identity.json').read_text())
          private_key = payload.get('privateKeyPem', '')
          certificate = payload.get('certificatePem', '')
          fingerprint = payload.get('certificateSha256', '').lower()
          expected = '004905e15f747bc9a635366138c01357b1c06615dfe6f3c3af9d3b1d52c1187f'
          if not private_key.startswith('-----BEGIN') or 'PRIVATE KEY-----' not in private_key:
              raise SystemExit('Signing service returned an invalid private key.')
          if not certificate.startswith('-----BEGIN CERTIFICATE-----'):
              raise SystemExit('Signing service returned an invalid certificate.')
          if fingerprint != expected:
              raise SystemExit('Signing certificate fingerprint mismatch.')
          Path('/tmp/jarvis_signing/private-key.pem').write_text(private_key)
          Path('/tmp/jarvis_signing/certificate.pem').write_text(certificate)
          Path('/tmp/jarvis_signing/certificate-sha256.txt').write_text(fingerprint + '\n')
          PY
          chmod 600 /tmp/jarvis_signing/private-key.pem
          openssl pkcs8 -topk8 -inform PEM -outform DER -nocrypt \
            -in /tmp/jarvis_signing/private-key.pem \
            -out /tmp/jarvis_signing/private-key.pk8
          ACTUAL_CERT_SHA="$(openssl x509 -in /tmp/jarvis_signing/certificate.pem -outform DER | sha256sum | awk '{print $1}')"
          test "$ACTUAL_CERT_SHA" = "$JARVIS_SIGNING_CERT_SHA256"
      - name: Create production Android shell
        run: |
          rm -rf /tmp/jarvis_legal
          flutter create --platforms=android --project-name jarvis_legal_enterprise --org com.jarvis /tmp/jarvis_legal
          rm -rf /tmp/jarvis_legal/lib /tmp/jarvis_legal/test
          cp -R legal_app/lib /tmp/jarvis_legal/lib
          cp -R legal_app/test /tmp/jarvis_legal/test
          cp legal_app/pubspec.yaml /tmp/jarvis_legal/pubspec.yaml
          python - <<'PY'
          from pathlib import Path

          manifest_path = Path('/tmp/jarvis_legal/android/app/src/main/AndroidManifest.xml')
          manifest_text = manifest_path.read_text()
          manifest_text = manifest_text.replace(
              'android:label="jarvis_legal_enterprise"',
              'android:label="JARVIS Legal Enterprise"',
          )
          manifest_path.write_text(manifest_text)

          main_path = Path('/tmp/jarvis_legal/lib/main.dart')
          main_text = main_path.read_text()
          main_text = main_text.replace('Owner access: $0.00', r'Owner access: \$0.00')

          import_marker = "import 'jarvis_legal_api.dart';"
          imports = "import 'chairman_auth.dart';\nimport 'chairman_board_room.dart';\n" + import_marker
          if "import 'chairman_auth.dart';" not in main_text:
              if import_marker not in main_text:
                  raise SystemExit('Unable to locate JARVIS legal API import marker.')
              main_text = main_text.replace(import_marker, imports, 1)

          home_marker = "home: const ChairmanCommandCenter(),"
          home_replacement = "home: const ChairmanAuthGate(child: ChairmanCommandCenter()),"
          if 'ChairmanAuthGate(child:' not in main_text:
              if home_marker not in main_text:
                  raise SystemExit('Unable to locate Chairman home marker.')
              main_text = main_text.replace(home_marker, home_replacement, 1)

          board_marker = """        const SizedBox(height: 14),
                  _chairmanBoardCard(),"""
          board_insert = """        const SizedBox(height: 14),
                  ChairmanBoardRoom(
                    matters: _matters,
                    onSendToCounsel: (String prompt) {
                      setState(() {
                        _aiController.text = prompt;
                        _index = 4;
                      });
                    },
                  ),
                  const SizedBox(height: 14),
                  _chairmanBoardCard(),"""
          if 'ChairmanBoardRoom(' not in main_text:
              if board_marker not in main_text:
                  raise SystemExit('Unable to locate Board Room composition marker.')
              main_text = main_text.replace(board_marker, board_insert, 1)

          main_path.write_text(main_text)
          PY
      - name: Resolve dependencies
        working-directory: /tmp/jarvis_legal
        run: flutter pub get
      - name: Analyze production source
        working-directory: /tmp/jarvis_legal
        run: flutter analyze
      - name: Run Chairman and board tests
        working-directory: /tmp/jarvis_legal
        run: flutter test
      - name: Build universal Chairman release APK
        working-directory: /tmp/jarvis_legal
        run: |
          flutter build apk --release \
            --dart-define=JARVIS_ROLE=chairman \
            --dart-define=JARVIS_SUBSCRIPTION_ACTIVE=false \
            --dart-define=JARVIS_HTTP_BASE="$JARVIS_HTTP_BASE"
      - name: Build optimized ARM64 Chairman APK
        working-directory: /tmp/jarvis_legal
        run: |
          flutter build apk --release --split-per-abi \
            --dart-define=JARVIS_ROLE=chairman \
            --dart-define=JARVIS_SUBSCRIPTION_ACTIVE=false \
            --dart-define=JARVIS_HTTP_BASE="$JARVIS_HTTP_BASE"
      - name: Sign and verify permanent Chairman APKs
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$APKSIGNER"
          mkdir -p dist
          "$APKSIGNER" sign \
            --key /tmp/jarvis_signing/private-key.pk8 \
            --cert /tmp/jarvis_signing/certificate.pem \
            --out dist/JARVIS-Legal-Enterprise-Chairman-READY.apk \
            /tmp/jarvis_legal/build/app/outputs/flutter-apk/app-release.apk
          "$APKSIGNER" sign \
            --key /tmp/jarvis_signing/private-key.pk8 \
            --cert /tmp/jarvis_signing/certificate.pem \
            --out dist/JARVIS-Legal-Enterprise-Chairman-READY-arm64.apk \
            /tmp/jarvis_legal/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          "$APKSIGNER" verify --verbose --print-certs dist/JARVIS-Legal-Enterprise-Chairman-READY.apk
          "$APKSIGNER" verify --verbose --print-certs dist/JARVIS-Legal-Enterprise-Chairman-READY-arm64.apk
          ACTUAL_CERT_SHA="$(openssl x509 -in /tmp/jarvis_signing/certificate.pem -outform DER | sha256sum | awk '{print $1}')"
          test "$ACTUAL_CERT_SHA" = "$JARVIS_SIGNING_CERT_SHA256"
          printf '%s  JARVIS permanent Android signing certificate\n' "$ACTUAL_CERT_SHA" > dist/SIGNING-CERT-SHA256.txt
          sha256sum dist/*.apk > dist/SHA256SUMS.txt
          rm -f /tmp/jarvis_signing/identity.json /tmp/jarvis_signing/private-key.pem /tmp/jarvis_signing/private-key.pk8
      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Legal-Enterprise-Chairman-PERMANENT-SIGNED-Android
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
            dist/SIGNING-CERT-SHA256.txt
          retention-days: 30
