name: JARVIS Legal Enterprise Chairman Production APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'legal_app/**'
      - 'jarvis_app/**'
      - '.github/workflows/jarvis-legal-enterprise.yml'

permissions:
  contents: read
  id-token: write

env:
  JARVIS_HTTP_BASE: https://jarvis-legal-enterprise-api.onrender.com
  JARVIS_SIGNING_BASE: https://jarvis-watch-bridge.floot.app
  GOOGLE_SERVER_CLIENT_ID: 498363735983-nka03bna11698m7o6ao0l7vnga8fb80e.apps.googleusercontent.com
  JARVIS_SIGNING_CERT_SHA256: 004905e15f747bc9a635366138c01357b1c06615dfe6f3c3af9d3b1d52c1187f
  JARVIS_ANDROID_PACKAGE: com.jarvis.jarvis_legal_enterprise

jobs:
  build-chairman-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Retrieve permanent Chairman signing identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/jarvis_signing
          OIDC_JSON="$(curl -fsSL \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=jarvis-legal-android-signing")"
          OIDC_TOKEN="$(OIDC_JSON="$OIDC_JSON" python - <<'PY'
          import json, os
          payload = json.loads(os.environ['OIDC_JSON'])
          token = payload.get('value', '')
          if not token:
              raise SystemExit('GitHub OIDC token was not returned.')
          print(token)
          PY
          )"
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            "${JARVIS_SIGNING_BASE}/_api/v1/internal/android-signing" \
            -o /tmp/jarvis_signing/identity.json
          python - <<'PY'
          import json
          from pathlib import Path

          payload = json.loads(Path('/tmp/jarvis_signing/identity.json').read_text())
          private_key = payload.get('privateKeyPem', '')
          certificate = payload.get('certificatePem', '')
          fingerprint = payload.get('certificateSha256', '').lower()
          expected = '004905e15f747bc9a635366138c01357b1c06615dfe6f3c3af9d3b1d52c1187f'
          if not private_key.startswith('-----BEGIN') or 'PRIVATE KEY-----' not in private_key:
              raise SystemExit('Signing service returned an invalid private key.')
          if not certificate.startswith('-----BEGIN CERTIFICATE-----'):
              raise SystemExit('Signing service returned an invalid certificate.')
          if fingerprint != expected:
              raise SystemExit('Signing certificate fingerprint mismatch.')
          Path('/tmp/jarvis_signing/private-key.pem').write_text(private_key)
          Path('/tmp/jarvis_signing/certificate.pem').write_text(certificate)
          PY
          chmod 600 /tmp/jarvis_signing/private-key.pem
          openssl pkcs8 -topk8 -inform PEM -outform DER -nocrypt \
            -in /tmp/jarvis_signing/private-key.pem \
            -out /tmp/jarvis_signing/private-key.pk8
          ACTUAL_CERT_SHA="$(openssl x509 -in /tmp/jarvis_signing/certificate.pem -outform DER | sha256sum | awk '{print $1}')"
          test "$ACTUAL_CERT_SHA" = "$JARVIS_SIGNING_CERT_SHA256"

      - name: Report production Google OAuth Android identity
        shell: bash
        run: |
          set -euo pipefail
          SHA1_COLON="$(openssl x509 -in /tmp/jarvis_signing/certificate.pem -noout -fingerprint -sha1 | sed 's/^sha1 Fingerprint=//I')"
          echo "JARVIS_ANDROID_PACKAGE=${JARVIS_ANDROID_PACKAGE}"
          echo "JARVIS_ANDROID_SIGNING_SHA1=${SHA1_COLON}"
          echo "JARVIS_ANDROID_SIGNING_SHA256=${JARVIS_SIGNING_CERT_SHA256}"

      - name: Validate production Google identity configuration
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GOOGLE_SERVER_CLIENT_ID" || {
            echo 'Missing Google server client ID.' >&2
            exit 1
          }

      - name: Prepare Android platform around checked-in app source
        working-directory: legal_app
        shell: bash
        run: |
          set -euo pipefail

          WIDGET_TEST_WAS_TRACKED=0
          if git ls-files --error-unmatch test/widget_test.dart >/dev/null 2>&1; then
            WIDGET_TEST_WAS_TRACKED=1
          fi

          flutter create \
            --platforms=android \
            --project-name jarvis_legal_enterprise \
            --org com.jarvis \
            --no-pub \
            .

          if [ "$WIDGET_TEST_WAS_TRACKED" -eq 0 ]; then
            rm -f test/widget_test.dart
          fi

          if [ -n "$(git status --porcelain -- lib pubspec.yaml test)" ]; then
            echo 'flutter create modified checked-in Legal Enterprise source:' >&2
            git status --porcelain -- lib pubspec.yaml test >&2
            exit 1
          fi

          python - <<'PY'
          from pathlib import Path

          manifest_path = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest_path.read_text()

          permission = '<uses-permission android:name="android.permission.INTERNET" />'
          if 'android.permission.INTERNET' not in text:
              text = text.replace('<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">\n    ' + permission,
                                  1)

          text = text.replace(
              'android:label="jarvis_legal_enterprise"',
              'android:label="JARVIS Legal Enterprise"',
          )

          if 'android:usesCleartextTraffic=' not in text:
              text = text.replace(
                  '<application\n',
                  '<application\n        android:usesCleartextTraffic="false"\n',
                  1,
              )

          manifest_path.write_text(text)
          PY

      - name: Resolve dependencies
        working-directory: legal_app
        run: flutter pub get

      - name: Analyze production source
        working-directory: legal_app
        run: flutter analyze

      - name: Run Chairman, access-policy, and board tests
        working-directory: legal_app
        run: flutter test

      - name: Build universal Chairman release APK
        working-directory: legal_app
        run: |
          flutter build apk --release \
            --target=lib/chairman_production_main.dart \
            --dart-define=JARVIS_ROLE=chairman \
            --dart-define=JARVIS_SUBSCRIPTION_ACTIVE=false \
            --dart-define=JARVIS_HTTP_BASE="$JARVIS_HTTP_BASE" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID"

      - name: Build optimized ARM64 Chairman APK
        working-directory: legal_app
        run: |
          flutter build apk --release --split-per-abi \
            --target=lib/chairman_production_main.dart \
            --dart-define=JARVIS_ROLE=chairman \
            --dart-define=JARVIS_SUBSCRIPTION_ACTIVE=false \
            --dart-define=JARVIS_HTTP_BASE="$JARVIS_HTTP_BASE" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID"

      - name: Sign and verify permanent Chairman APKs
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt | sort -V | tail -1)"
          test -x "$APKSIGNER"
          test -x "$AAPT"

          mkdir -p dist
          "$APKSIGNER" sign \
            --key /tmp/jarvis_signing/private-key.pk8 \
            --cert /tmp/jarvis_signing/certificate.pem \
            --out dist/JARVIS-Legal-Enterprise-Chairman-PRODUCTION.apk \
            legal_app/build/app/outputs/flutter-apk/app-release.apk
          "$APKSIGNER" sign \
            --key /tmp/jarvis_signing/private-key.pk8 \
            --cert /tmp/jarvis_signing/certificate.pem \
            --out dist/JARVIS-Legal-Enterprise-Chairman-PRODUCTION-arm64.apk \
            legal_app/build/app/outputs/flutter-apk/app-arm64-v8a-release.apk

          "$APKSIGNER" verify --verbose --print-certs dist/JARVIS-Legal-Enterprise-Chairman-PRODUCTION.apk
          "$APKSIGNER" verify --verbose --print-certs dist/JARVIS-Legal-Enterprise-Chairman-PRODUCTION-arm64.apk

          "$AAPT" dump permissions dist/JARVIS-Legal-Enterprise-Chairman-PRODUCTION.apk | grep -q 'android.permission.INTERNET'
          "$AAPT" dump badging dist/JARVIS-Legal-Enterprise-Chairman-PRODUCTION.apk | grep -q "application-label:'JARVIS Legal Enterprise'"

          ACTUAL_CERT_SHA="$(openssl x509 -in /tmp/jarvis_signing/certificate.pem -outform DER | sha256sum | awk '{print $1}')"
          test "$ACTUAL_CERT_SHA" = "$JARVIS_SIGNING_CERT_SHA256"
          printf '%s  JARVIS permanent Android signing certificate\n' "$ACTUAL_CERT_SHA" > dist/SIGNING-CERT-SHA256.txt
          sha256sum dist/*.apk > dist/SHA256SUMS.txt

          rm -f \
            /tmp/jarvis_signing/identity.json \
            /tmp/jarvis_signing/private-key.pem \
            /tmp/jarvis_signing/private-key.pk8

      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-Legal-Enterprise-Chairman-PRODUCTION-SIGNED-Android
          path: |
            dist/*.apk
            dist/SHA256SUMS.txt
            dist/SIGNING-CERT-SHA256.txt
          retention-days: 30


  build-jarvis-ai-assistant:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Retrieve permanent JARVIS signing identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/jarvis_assistant_signing
          OIDC_JSON="$(curl -fsSL \
            -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=jarvis-legal-android-signing")"
          OIDC_TOKEN="$(OIDC_JSON="$OIDC_JSON" python - <<'PY'
          import json, os
          payload = json.loads(os.environ['OIDC_JSON'])
          token = payload.get('value', '')
          if not token:
              raise SystemExit('GitHub OIDC token was not returned.')
          print(token)
          PY
          )"
          curl -fsSL -X POST \
            -H "Authorization: Bearer ${OIDC_TOKEN}" \
            "${JARVIS_SIGNING_BASE}/_api/v1/internal/android-signing" \
            -o /tmp/jarvis_assistant_signing/identity.json
          python - <<'PY'
          import json
          from pathlib import Path
          payload = json.loads(Path('/tmp/jarvis_assistant_signing/identity.json').read_text())
          private_key = payload.get('privateKeyPem', '')
          certificate = payload.get('certificatePem', '')
          fingerprint = payload.get('certificateSha256', '').lower()
          expected = '004905e15f747bc9a635366138c01357b1c06615dfe6f3c3af9d3b1d52c1187f'
          if not private_key.startswith('-----BEGIN') or 'PRIVATE KEY-----' not in private_key:
              raise SystemExit('Signing service returned an invalid private key.')
          if not certificate.startswith('-----BEGIN CERTIFICATE-----'):
              raise SystemExit('Signing service returned an invalid certificate.')
          if fingerprint != expected:
              raise SystemExit('Signing certificate fingerprint mismatch.')
          Path('/tmp/jarvis_assistant_signing/private-key.pem').write_text(private_key)
          Path('/tmp/jarvis_assistant_signing/certificate.pem').write_text(certificate)
          PY
          chmod 600 /tmp/jarvis_assistant_signing/private-key.pem
          openssl pkcs8 -topk8 -inform PEM -outform DER -nocrypt \
            -in /tmp/jarvis_assistant_signing/private-key.pem \
            -out /tmp/jarvis_assistant_signing/private-key.pk8

      - name: Prepare JARVIS AI Assistant Android platform
        working-directory: jarvis_app
        shell: bash
        run: |
          set -euo pipefail
          flutter create --platforms=android --org com.jarvis .
          rm -f test/widget_test.dart
          python scripts/prepare_native.py
          python - <<'PY'
          from pathlib import Path

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          text = text.replace(
              'android:label="project_jarvis"',
              'android:label="JARVIS AI Assistant"',
          )
          manifest.write_text(text)

          gradle = Path('android/app/build.gradle.kts')
          text = gradle.read_text()
          if 'useLegacyPackaging = true' not in text:
              text = text.replace(
                  'android {',
                  '''android {
              packaging {
                  jniLibs {
                      useLegacyPackaging = true
                  }
              }
          ''',
                  1,
              )
          if 'abiFilters += listOf("arm64-v8a")' not in text:
              text = text.replace(
                  'minSdk = 26',
                  '''minSdk = 26
                  ndk {
                      abiFilters += listOf("arm64-v8a")
                  }''',
                  1,
              )
          gradle.write_text(text)
          PY

      - name: Bundle local JARVIS avatar assets
        working-directory: jarvis_app
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p assets/models assets/vendor/three/addons/loaders assets/vendor/three/addons/utils

          curl --fail --location --retry 5 --retry-delay 3 \
            https://raw.githubusercontent.com/mrdoob/three.js/r180/build/three.module.js \
            --output assets/vendor/three/three.module.js
          curl --fail --location --retry 5 --retry-delay 3 \
            https://raw.githubusercontent.com/mrdoob/three.js/r180/examples/jsm/loaders/GLTFLoader.js \
            --output assets/vendor/three/addons/loaders/GLTFLoader.js
          curl --fail --location --retry 5 --retry-delay 3 \
            https://raw.githubusercontent.com/mrdoob/three.js/r180/examples/jsm/utils/BufferGeometryUtils.js \
            --output assets/vendor/three/addons/utils/BufferGeometryUtils.js

          curl --fail --location --retry 5 --retry-delay 3 \
            https://raw.githubusercontent.com/ibrews/VitruvianGodot/main/godot_project/vitruvian_body.glb \
            --output assets/models/vitruvian_body.glb
          curl --fail --location --retry 5 --retry-delay 3 \
            https://raw.githubusercontent.com/ibrews/VitruvianGodot/main/godot_project/vitruvian_head.glb \
            --output assets/models/vitruvian_head.glb
          curl --fail --location --retry 5 --retry-delay 3 \
            https://raw.githubusercontent.com/ibrews/VitruvianGodot/main/godot_project/hairtool_cards.glb \
            --output assets/models/hairtool_cards.glb

          for asset in vit_face_bc.png vit_mouth.png vit_sclera.png vit_iris.png vit_hair_atlas.png vit_hair_opacity.png; do
            curl --fail --location --retry 5 --retry-delay 3 \
              "https://raw.githubusercontent.com/ibrews/VitruvianGodot/main/godot_project/$asset" \
              --output "assets/models/$asset"
          done

          test "$(stat -c %s assets/models/vitruvian_body.glb)" -eq 6879364
          test "$(stat -c %s assets/models/vitruvian_head.glb)" -eq 10189832
          test "$(stat -c %s assets/models/hairtool_cards.glb)" -eq 14839096
          test ! -f assets/models/speaker_ecapa_xnnpack_fp32.pte

          flutter pub get

      - name: Analyze JARVIS AI Assistant
        working-directory: jarvis_app
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Build JARVIS AI Assistant ARM64
        working-directory: jarvis_app
        run: |
          flutter build apk --release --target-platform android-arm64 \
            --dart-define=JARVIS_HTTP_BASE="$JARVIS_HTTP_BASE" \
            --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID"

      - name: Sign and verify JARVIS AI Assistant
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt | sort -V | tail -1)"
          mkdir -p assistant_dist

          "$APKSIGNER" sign \
            --key /tmp/jarvis_assistant_signing/private-key.pk8 \
            --cert /tmp/jarvis_assistant_signing/certificate.pem \
            --out assistant_dist/JARVIS-AI-ASSISTANT-FINAL-ARM64.apk \
            jarvis_app/build/app/outputs/flutter-apk/app-release.apk

          "$APKSIGNER" verify --verbose --print-certs \
            assistant_dist/JARVIS-AI-ASSISTANT-FINAL-ARM64.apk

          "$AAPT" dump badging assistant_dist/JARVIS-AI-ASSISTANT-FINAL-ARM64.apk \
            | tee assistant_dist/badging.txt
          grep "package: name='com.jarvis.project_jarvis'" assistant_dist/badging.txt
          grep "native-code: 'arm64-v8a'" assistant_dist/badging.txt
          grep "application-label:'JARVIS AI Assistant'" assistant_dist/badging.txt

          SHA1_COLON="$(openssl x509 -in /tmp/jarvis_assistant_signing/certificate.pem -noout -fingerprint -sha1 | sed 's/^sha1 Fingerprint=//I')"
          echo "ANDROID_PACKAGE=com.jarvis.project_jarvis" > assistant_dist/OAUTH-ANDROID-IDENTITY.txt
          echo "SIGNING_SHA1=${SHA1_COLON}" >> assistant_dist/OAUTH-ANDROID-IDENTITY.txt
          sha256sum assistant_dist/JARVIS-AI-ASSISTANT-FINAL-ARM64.apk \
            > assistant_dist/JARVIS-AI-ASSISTANT-FINAL-ARM64.apk.sha256
          ls -lh assistant_dist/JARVIS-AI-ASSISTANT-FINAL-ARM64.apk

          rm -f \
            /tmp/jarvis_assistant_signing/identity.json \
            /tmp/jarvis_assistant_signing/private-key.pem \
            /tmp/jarvis_assistant_signing/private-key.pk8

      - uses: actions/upload-artifact@v4
        with:
          name: JARVIS-AI-ASSISTANT-FINAL-ARM64
          path: |
            assistant_dist/JARVIS-AI-ASSISTANT-FINAL-ARM64.apk
            assistant_dist/JARVIS-AI-ASSISTANT-FINAL-ARM64.apk.sha256
            assistant_dist/OAUTH-ANDROID-IDENTITY.txt
          compression-level: 0
          retention-days: 30
