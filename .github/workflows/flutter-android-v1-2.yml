name: JARVIS Flutter Android v1.2

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/jarvis-human-autonomous-avatar
    paths:
      - 'jarvis_app/**'
      - '.github/workflows/flutter-android-v1-2.yml'

permissions:
  contents: write

concurrency:
  group: jarvis-flutter-v1-2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-flutter-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain
        run: |
          flutter --version
          dart --version
          java -version

      - name: Generate Android scaffold
        working-directory: jarvis_app
        run: |
          flutter create --platforms=android .
          rm -f test/widget_test.dart
          python scripts/prepare_native.py

      - name: Bundle standalone Jarvis 3D model
        working-directory: jarvis_app
        run: |
          set -euo pipefail
          mkdir -p assets/models
          curl --fail --location --retry 5 --retry-delay 3             https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/CesiumMan/glTF-Binary/CesiumMan.glb             --output assets/models/CesiumMan.glb
          test "$(stat -c %s assets/models/CesiumMan.glb)" -eq 438044
          flutter pub get

      - name: Bundle on-device speaker identity model
        working-directory: jarvis_app
        run: |
          set -euo pipefail
          mkdir -p assets/models
          curl --fail --location --retry 5 --retry-delay 3 \
            "https://huggingface.co/mlboydaisuke/ECAPA-TDNN-Speaker-ExecuTorch/resolve/main/speaker_ecapa_xnnpack_fp32.pte?download=true" \
            --output assets/models/speaker_ecapa_xnnpack_fp32.pte
          test "$(stat -c %s assets/models/speaker_ecapa_xnnpack_fp32.pte)" -gt 80000000
          flutter pub get

      - name: Flutter analyze
        working-directory: jarvis_app
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Build debug APK
        working-directory: jarvis_app
        env:
          JARVIS_HTTP_BASE: ${{ vars.JARVIS_HTTP_BASE }}
          JARVIS_WS_URL: ${{ vars.JARVIS_WS_URL }}
          JARVIS_CLIENT_TOKEN: ${{ secrets.JARVIS_CLIENT_TOKEN }}
        run: |
          HTTP_BASE="${JARVIS_HTTP_BASE:-http://10.0.2.2:8000}"
          WS_URL="${JARVIS_WS_URL:-ws://10.0.2.2:8000/ws/jarvis}"
          TOKEN="${JARVIS_CLIENT_TOKEN:-}"
          flutter build apk --debug \
            --dart-define=JARVIS_HTTP_BASE="$HTTP_BASE" \
            --dart-define=JARVIS_WS_URL="$WS_URL" \
            --dart-define=JARVIS_CLIENT_TOKEN="$TOKEN"

      - name: Stage APK
        run: |
          mkdir -p dist
          cp jarvis_app/build/app/outputs/flutter-apk/app-debug.apk dist/JARVIS-v1.2-debug.apk
          sha256sum dist/JARVIS-v1.2-debug.apk > dist/JARVIS-v1.2-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-v1.2-Android
          path: |
            dist/JARVIS-v1.2-debug.apk
            dist/JARVIS-v1.2-debug.apk.sha256
          retention-days: 30

      - name: Publish stable Jarvis APK link
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git tag -f jarvis-latest "$GITHUB_SHA"
          git push origin -f jarvis-latest

          if gh release view jarvis-latest >/dev/null 2>&1; then
            gh release upload jarvis-latest               dist/JARVIS-v1.2-debug.apk               dist/JARVIS-v1.2-debug.apk.sha256               --clobber
            gh release edit jarvis-latest               --title "JARVIS Latest Android"               --notes "Latest verified JARVIS Android build from main. Android may require permission to install apps from your browser or file manager."
          else
            gh release create jarvis-latest               dist/JARVIS-v1.2-debug.apk               dist/JARVIS-v1.2-debug.apk.sha256               --title "JARVIS Latest Android"               --notes "Latest verified JARVIS Android build from main. Android may require permission to install apps from your browser or file manager."               --prerelease
          fi

