name: JARVIS Flutter Android v1.2

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - feature/jarvis-human-behavior-v2
    paths:
      - 'jarvis_app/**'
      - '.github/workflows/flutter-android-v1-2.yml'

permissions:
  contents: read

concurrency:
  group: jarvis-flutter-v1-2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-flutter-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain
        run: |
          flutter --version
          dart --version
          java -version

      - name: Generate Android scaffold
        working-directory: jarvis_app
        run: |
          flutter create --platforms=android .
          rm -f test/widget_test.dart
          python scripts/prepare_native.py

      - name: Bundle standalone Jarvis 3D model
        working-directory: jarvis_app
        run: |
          set -euo pipefail
          mkdir -p assets/models
          curl --fail --location --retry 5 --retry-delay 3             https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/CesiumMan/glTF-Binary/CesiumMan.glb             --output assets/models/CesiumMan.glb
          test "$(stat -c %s assets/models/CesiumMan.glb)" -eq 438044
          flutter pub get

      - name: Bundle on-device speaker identity model
        working-directory: jarvis_app
        run: |
          set -euo pipefail
          mkdir -p assets/models
          curl --fail --location --retry 5 --retry-delay 3 \
            "https://huggingface.co/mlboydaisuke/ECAPA-TDNN-Speaker-ExecuTorch/resolve/main/speaker_ecapa_xnnpack_fp32.pte?download=true" \
            --output assets/models/speaker_ecapa_xnnpack_fp32.pte
          test "$(stat -c %s assets/models/speaker_ecapa_xnnpack_fp32.pte)" -gt 80000000
          flutter pub get

      - name: Build licensed expressive male Jarvis avatar
        working-directory: jarvis_app
        run: |
          set -euo pipefail
          WORK="$PWD/.cache/rocketbox"
          OUT="$PWD/assets/models/JarvisRocketbox.glb"
          mkdir -p "$WORK/textures" assets/models

          curl --fail --location --retry 5 --retry-delay 3 \
            "https://raw.githubusercontent.com/microsoft/Microsoft-Rocketbox/master/Assets/Avatars/Adults/Male_Adult_01/Export/Male_Adult_01_facial.fbx" \
            --output "$WORK/Male_Adult_01_facial.fbx"

          for file in \
            m002_body_color.tga \
            m002_body_normal.tga \
            m002_body_specular.tga \
            m002_head_color.tga \
            m002_head_normal.tga \
            m002_head_specular.tga \
            m002_opacity_color.tga
          do
            curl --fail --location --retry 5 --retry-delay 3 \
              "https://raw.githubusercontent.com/microsoft/Microsoft-Rocketbox/master/Assets/Avatars/Adults/Male_Adult_01/Textures/$file" \
              --output "$WORK/textures/$file"
          done

          curl --fail --location --retry 5 --retry-delay 3 \
            "https://raw.githubusercontent.com/microsoft/Microsoft-Rocketbox/master/LICENSE.md" \
            --output assets/models/ROCKETBOX-LICENSE.txt

          curl --fail --location --retry 5 --retry-delay 3 \
            "https://raw.githubusercontent.com/aralde/react-ai-avatar/425860b7d82bea42d946d2d1171ae912c30fd7fa/tools/rocketbox-asset/convert.mjs" \
            --output "$WORK/convert.mjs"
          curl --fail --location --retry 5 --retry-delay 3 \
            "https://raw.githubusercontent.com/aralde/react-ai-avatar/425860b7d82bea42d946d2d1171ae912c30fd7fa/tools/rocketbox-asset/embed-textures.mjs" \
            --output "$WORK/embed-textures.mjs"

          sed -i 's/f001_/m002_/g' "$WORK/embed-textures.mjs"

          pushd "$WORK"
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund --save-exact fbx2gltf@0.9.7-p1
          node convert.mjs Male_Adult_01_facial.fbx "$OUT"
          node embed-textures.mjs "$OUT" "$WORK/textures" --size=512
          popd

          test -s "$OUT"

          node - "$OUT" <<'NODE'
          const fs = require('fs');
          const file = process.argv[2];
          const glb = fs.readFileSync(file);
          if (glb.readUInt32LE(0) !== 0x46546c67) {
            throw new Error('JarvisRocketbox.glb is not a GLB file');
          }
          const jsonLength = glb.readUInt32LE(12);
          const json = JSON.parse(
            glb.subarray(20, 20 + jsonLength).toString('utf8')
          );
          const names = new Set(
            (json.meshes || []).flatMap(
              (mesh) => (mesh.extras && mesh.extras.targetNames) || []
            )
          );
          for (const required of [
            'jawOpen',
            'mouthSmileLeft',
            'mouthSmileRight',
            'eyeBlinkLeft',
            'eyeBlinkRight',
            'browInnerUp'
          ]) {
            if (!names.has(required)) {
              throw new Error('Missing required facial morph: ' + required);
            }
          }
          if (names.size < 50) {
            throw new Error(
              'Expected at least 50 ARKit facial morphs, found ' + names.size
            );
          }
          console.log(
            'Rocketbox Jarvis validated with ' +
              names.size +
              ' named facial morphs.'
          );
          NODE

          flutter pub get

      - name: Flutter analyze
        working-directory: jarvis_app
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Build debug APK
        working-directory: jarvis_app
        env:
          JARVIS_HTTP_BASE: ${{ vars.JARVIS_HTTP_BASE }}
          JARVIS_WS_URL: ${{ vars.JARVIS_WS_URL }}
          JARVIS_CLIENT_TOKEN: ${{ secrets.JARVIS_CLIENT_TOKEN }}
        run: |
          HTTP_BASE="${JARVIS_HTTP_BASE:-http://10.0.2.2:8000}"
          WS_URL="${JARVIS_WS_URL:-ws://10.0.2.2:8000/ws/jarvis}"
          TOKEN="${JARVIS_CLIENT_TOKEN:-}"
          flutter build apk --debug \
            --dart-define=JARVIS_HTTP_BASE="$HTTP_BASE" \
            --dart-define=JARVIS_WS_URL="$WS_URL" \
            --dart-define=JARVIS_CLIENT_TOKEN="$TOKEN"

      - name: Stage APK
        run: |
          mkdir -p dist
          cp jarvis_app/build/app/outputs/flutter-apk/app-debug.apk dist/JARVIS-v1.2-debug.apk
          sha256sum dist/JARVIS-v1.2-debug.apk > dist/JARVIS-v1.2-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-v1.2-Android
          path: |
            dist/JARVIS-v1.2-debug.apk
            dist/JARVIS-v1.2-debug.apk.sha256
          retention-days: 30
