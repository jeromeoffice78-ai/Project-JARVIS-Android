name: JARVIS Flutter Android v1.3

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/**'
      - 'fix/**'
    paths:
      - 'jarvis_app/**'
      - '.github/workflows/flutter-android-v1-2.yml'

permissions:
  contents: write

concurrency:
  group: jarvis-flutter-v1-3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-flutter-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show toolchain
        run: |
          flutter --version
          dart --version
          java -version

      - name: Generate Android scaffold
        working-directory: jarvis_app
        run: |
          flutter create --platforms=android .
          rm -f test/widget_test.dart
          python scripts/prepare_native.py

      - name: Enforce zero-placeholder release policy
        working-directory: jarvis_app
        run: |
          set -euo pipefail
          if grep -RInE \
            --include='*.dart' --include='*.kt' --include='*.java' \
            '(^|[^[:alnum:]_])(TODO|FIXME)([^[:alnum:]_]|$)|coming[[:space:]]+soon|placeholder|mock[[:space:]]+(response|result|data)|fake[[:space:]]+(response|result|data)|stub[[:space:]]+(implementation|response|result)' \
            lib scripts/native; then
            echo 'JARVIS release blocked: placeholder implementation detected.'
            exit 1
          fi

      - name: Bundle standalone Jarvis 3D model
        working-directory: jarvis_app
        run: |
          set -euo pipefail
          mkdir -p assets/models
          curl --fail --location --retry 5 --retry-delay 3             https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/CesiumMan/glTF-Binary/CesiumMan.glb             --output assets/models/CesiumMan.glb
          test "$(stat -c %s assets/models/CesiumMan.glb)" -eq 438044
          flutter pub get

      - name: Bundle local Three.js avatar runtime
        working-directory: jarvis_app
        run: |
          set -euo pipefail
          mkdir -p assets/vendor/three/addons/loaders
          mkdir -p assets/vendor/three/addons/utils

          curl --fail --location --retry 5 --retry-delay 3 \
            https://raw.githubusercontent.com/mrdoob/three.js/r180/build/three.module.js \
            --output assets/vendor/three/three.module.js
          curl --fail --location --retry 5 --retry-delay 3 \
            https://raw.githubusercontent.com/mrdoob/three.js/r180/examples/jsm/loaders/GLTFLoader.js \
            --output assets/vendor/three/addons/loaders/GLTFLoader.js
          curl --fail --location --retry 5 --retry-delay 3 \
            https://raw.githubusercontent.com/mrdoob/three.js/r180/examples/jsm/utils/BufferGeometryUtils.js \
            --output assets/vendor/three/addons/utils/BufferGeometryUtils.js

          test -s assets/vendor/three/three.module.js
          test -s assets/vendor/three/addons/loaders/GLTFLoader.js
          test -s assets/vendor/three/addons/utils/BufferGeometryUtils.js

      - name: Bundle photoreal human Jarvis assets
        working-directory: jarvis_app
        run: |
          set -euo pipefail
          mkdir -p assets/models

          curl --fail --location --retry 5 --retry-delay 3 \
            https://raw.githubusercontent.com/ibrews/VitruvianGodot/main/godot_project/vitruvian_body.glb \
            --output assets/models/vitruvian_body.glb
          curl --fail --location --retry 5 --retry-delay 3 \
            https://raw.githubusercontent.com/ibrews/VitruvianGodot/main/godot_project/vitruvian_head.glb \
            --output assets/models/vitruvian_head.glb
          curl --fail --location --retry 5 --retry-delay 3 \
            https://raw.githubusercontent.com/ibrews/VitruvianGodot/main/godot_project/hairtool_cards.glb \
            --output assets/models/hairtool_cards.glb

          for asset in vit_face_bc.png vit_mouth.png vit_sclera.png vit_iris.png vit_hair_atlas.png vit_hair_opacity.png; do
            curl --fail --location --retry 5 --retry-delay 3 \
              "https://raw.githubusercontent.com/ibrews/VitruvianGodot/main/godot_project/$asset" \
              --output "assets/models/$asset"
          done

          test "$(stat -c %s assets/models/vitruvian_body.glb)" -eq 6879364
          test "$(stat -c %s assets/models/vitruvian_head.glb)" -eq 10189832
          test "$(stat -c %s assets/models/hairtool_cards.glb)" -eq 14839096
          test -s assets/models/vit_face_bc.png
          test -s assets/models/vit_mouth.png
          test -s assets/models/vit_sclera.png
          test -s assets/models/vit_iris.png
          flutter pub get

      - name: Bundle on-device speaker identity model
        working-directory: jarvis_app
        run: |
          set -euo pipefail
          mkdir -p assets/models
          curl --fail --location --retry 5 --retry-delay 3 \
            "https://huggingface.co/mlboydaisuke/ECAPA-TDNN-Speaker-ExecuTorch/resolve/main/speaker_ecapa_xnnpack_fp32.pte?download=true" \
            --output assets/models/speaker_ecapa_xnnpack_fp32.pte
          test "$(stat -c %s assets/models/speaker_ecapa_xnnpack_fp32.pte)" -gt 80000000
          flutter pub get

      - name: Flutter analyze
        working-directory: jarvis_app
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test signed installer selection
        working-directory: jarvis_app
        run: flutter test test/jarvis_signed_release_test.dart

      - name: Test cloud authentication lifecycle
        working-directory: jarvis_app
        run: flutter test test/jarvis_session_lifecycle_test.dart

      - name: Test Google sign-in failure diagnostics
        working-directory: jarvis_app
        run: flutter test test/jarvis_google_sign_in_diagnostics_test.dart

      - name: Build debug APK
        working-directory: jarvis_app
        env:
          JARVIS_HTTP_BASE: ${{ vars.JARVIS_HTTP_BASE }}
          JARVIS_WS_URL: ${{ vars.JARVIS_WS_URL }}
        run: |
          HTTP_BASE="${JARVIS_HTTP_BASE:-https://jarvis-legal-enterprise-api.onrender.com}"
          WS_URL="${JARVIS_WS_URL:-wss://jarvis-legal-enterprise-api.onrender.com/ws/jarvis}"
          flutter build apk --debug \
            --dart-define=JARVIS_HTTP_BASE="$HTTP_BASE" \
            --dart-define=JARVIS_WS_URL="$WS_URL"

      - name: Stage APK
        run: |
          mkdir -p dist
          cp jarvis_app/build/app/outputs/flutter-apk/app-debug.apk dist/JARVIS-v1.3-debug.apk
          sha256sum dist/JARVIS-v1.3-debug.apk > dist/JARVIS-v1.3-debug.apk.sha256

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-v1.3-Android
          path: |
            dist/JARVIS-v1.3-debug.apk
            dist/JARVIS-v1.3-debug.apk.sha256
          retention-days: 30

      # This workflow intentionally produces a debug APK for CI only.
      # Google Play Services identifies the debug signer separately and will
      # reject production Android OAuth credentials with DEVELOPER_ERROR (10).
      # User-downloadable builds must come from publish-jarvis-signed-release.yml.
      - name: Publish immutable JARVIS AI Assistant release
        if: false # Never publish developer-signed APKs as production downloads
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="jarvis-ai-assistant-v1.3-build-${GITHUB_RUN_NUMBER}"
          cp dist/JARVIS-v1.3-debug.apk dist/JARVIS-AI-ASSISTANT-v1.3.apk
          cp dist/JARVIS-v1.3-debug.apk.sha256 dist/JARVIS-AI-ASSISTANT-v1.3.apk.sha256
          sed -i 's#dist/JARVIS-v1.3-debug.apk#JARVIS-AI-ASSISTANT-v1.3.apk#' dist/JARVIS-AI-ASSISTANT-v1.3.apk.sha256
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              dist/JARVIS-AI-ASSISTANT-v1.3.apk \
              dist/JARVIS-AI-ASSISTANT-v1.3.apk.sha256 \
              --clobber
          else
            gh release create "$TAG" \
              dist/JARVIS-AI-ASSISTANT-v1.3.apk \
              dist/JARVIS-AI-ASSISTANT-v1.3.apk.sha256 \
              --target "$GITHUB_SHA" \
              --title "JARVIS AI Assistant v1.3 build ${GITHUB_RUN_NUMBER}" \
              --notes "Verified JARVIS AI Assistant Android build from commit $GITHUB_SHA. Includes voice, realtime conversation, vision, people and voice memory, Bluetooth and cloud devices, phone controls, music playback, avatar presence, device defense, and Chairman authentication."
          fi
