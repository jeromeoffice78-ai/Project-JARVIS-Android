name: Build JARVIS SP545C Android 14
# Signing service authorization refreshed for branded APK rebuild.

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/build-jarvis-sp545c.yml"
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

# A new source commit supersedes an older queued or compiling APK.
concurrency:
  group: jarvis-sp545c-${{ github.ref }}
  cancel-in-progress: true

env:
  JARVIS_HTTP_BASE: https://jarvis-legal-enterprise-api.onrender.com
  GOOGLE_SERVER_CLIENT_ID: 498363735983-nka03bna11698m7o6aool7vnga8fb80e.apps.googleusercontent.com
  JARVIS_SIGNING_BASE: https://jarvis-watch-bridge.floot.app
  JARVIS_SIGNING_CERT_SHA256: 004905e15f747bc9a635366138c01357b1c06615dfe6f3c3af9d3b1d52c1187f

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v5

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Download and verify approved JARVIS artwork
        working-directory: jarvis_app
        run: |
          set -euo pipefail
          mkdir -p assets/branding
          curl --fail --location --retry 5 --retry-delay 3 --max-time 90 \
            "https://jarvis-watch-bridge.floot.app/_cdn/static/bf252f27-cac5-4b08-be13-7f8db203e30a-jarvis_ai_assistant_brand_icon.png" \
            --output assets/branding/jarvis_ai_assistant_brand_icon.png
          echo "dae4207780f5648dd639908bdded72b5aa2bbb06fe54c77e1712de9f10a7631e  assets/branding/jarvis_ai_assistant_brand_icon.png" | sha256sum --check --strict
          python3 -m py_compile scripts/prepare_native.py
          echo "JARVIS custom branded image verified"

      - name: Obtain permanent JARVIS signing identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/jarvis_signing
          OIDC_JSON="$(curl -fsSL             -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}"             "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=jarvis-legal-android-signing")"
          OIDC_TOKEN="$(OIDC_JSON="$OIDC_JSON" python3 - <<'PY'
          import json, os
          payload=json.loads(os.environ['OIDC_JSON'])
          token=payload.get('value','')
          if not token:
              raise SystemExit('GitHub OIDC token was not returned.')
          print(token)
          PY
          )"
          curl -fsSL -X POST             -H "Authorization: Bearer ${OIDC_TOKEN}"             "${JARVIS_SIGNING_BASE}/_api/v1/internal/android-signing"             -o /tmp/jarvis_signing/identity.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          p=json.loads(Path('/tmp/jarvis_signing/identity.json').read_text())
          key=p.get('privateKeyPem','')
          cert=p.get('certificatePem','')
          fp=p.get('certificateSha256','').lower()
          expected='004905e15f747bc9a635366138c01357b1c06615dfe6f3c3af9d3b1d52c1187f'
          if not key.startswith('-----BEGIN') or not cert.startswith('-----BEGIN CERTIFICATE-----'):
              raise SystemExit('Invalid signing identity.')
          if fp != expected:
              raise SystemExit('Signing fingerprint mismatch.')
          Path('/tmp/jarvis_signing/private-key.pem').write_text(key)
          Path('/tmp/jarvis_signing/certificate.pem').write_text(cert)
          PY
          chmod 600 /tmp/jarvis_signing/private-key.pem
          openssl pkcs8 -topk8 -inform PEM -outform DER -nocrypt             -in /tmp/jarvis_signing/private-key.pem             -out /tmp/jarvis_signing/private-key.pk8

      - name: Generate stable Android package
        working-directory: jarvis_app
        run: |
          set -euo pipefail
          flutter create --platforms=android --org com.jarvis .
          rm -f test/widget_test.dart
          python scripts/prepare_native.py
          python3 - <<'PY'
          from pathlib import Path
          manifest=Path('android/app/src/main/AndroidManifest.xml')
          text=manifest.read_text()
          text=text.replace('android:label="project_jarvis"', 'android:label="JARVIS AI Assistant"')
          manifest.write_text(text)
          PY

      - name: Bundle compact SP545C 3D model and locally hosted JavaScript
        working-directory: jarvis_app
        run: |
          set -euo pipefail
          mkdir -p assets/models assets/vendor/three/addons/loaders assets/vendor/three/addons/utils
          curl --fail --location --retry 5 --retry-delay 3 \
            https://raw.githubusercontent.com/mrdoob/three.js/r180/build/three.module.js \
            --output assets/vendor/three/three.module.js
          curl --fail --location --retry 5 --retry-delay 3 \
            https://raw.githubusercontent.com/mrdoob/three.js/r180/examples/jsm/loaders/GLTFLoader.js \
            --output assets/vendor/three/addons/loaders/GLTFLoader.js
          curl --fail --location --retry 5 --retry-delay 3 \
            https://raw.githubusercontent.com/mrdoob/three.js/r180/examples/jsm/utils/BufferGeometryUtils.js \
            --output assets/vendor/three/addons/utils/BufferGeometryUtils.js
          curl --fail --location --retry 5 --retry-delay 3 \
            https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/CesiumMan/glTF-Binary/CesiumMan.glb \
            --output assets/models/CesiumMan.glb
          python3 - <<'PY'
          import struct
          from pathlib import Path
          p=Path('assets/models/CesiumMan.glb')
          data=p.read_bytes()
          assert data[:4]==b'glTF' and struct.unpack_from('<I',data,8)[0]==len(data)
          assert 100000<len(data)<5000000
          print('Compact human model validated:',len(data),'bytes')
          PY

      - name: Optimize full JARVIS for SP545C low-memory Android 14
        working-directory: jarvis_app
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          pubspec=Path('pubspec.yaml')
          p=pubspec.read_text()
          assert 'version: 1.3.13+17' in p, 'Review existing app version before incrementing phone build'
          p=p.replace('version: 1.3.13+17','version: 1.3.14+18',1)
          heavy=('vitruvian_body.glb','vitruvian_head.glb','hairtool_cards.glb',
                 'vit_face_bc.png','vit_mouth.png','vit_sclera.png','vit_iris.png',
                 'vit_hair_atlas.png','vit_hair_opacity.png')
          p='\n'.join(line for line in p.splitlines() if not any(h in line for h in heavy))+'\n'
          assert 'assets/models/CesiumMan.glb' in p
          pubspec.write_text(p)
          html_path=Path('assets/avatar/jarvis_human_avatar.html')
          html=html_path.read_text()
          def patch(old,new):
              global html
              assert html.count(old)==1, 'Expected exactly one occurrence: '+old[:65]
              html=html.replace(old,new,1)
          patch("const status = document.getElementById('status');",
                "const status = document.getElementById('status');\n"
                "const sp545cLowMemory = true; // device-specific build profile")
          patch("renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));",
                "renderer.setPixelRatio(1.0);")
          patch("function texture(rel, srgb=true){",
                "function texture(rel, srgb=true){\n"
                "  if(sp545cLowMemory){\n"
                "    const t=new THREE.DataTexture(new Uint8Array([255,255,255,255]),1,1,THREE.RGBAFormat);\n"
                "    t.needsUpdate=true;return t;\n"
                "  }")
          patch("async function load(){\n  try{",
                "async function load(){\n  try{\n"
                "    if(sp545cLowMemory){await loadLightweightHuman();return;}")
          html_path.write_text(html)
          # On this low-RAM edition, the repair button restarts the compact
          # 3D human; it does not promise to load excluded high-resolution GLBs.
          view=Path('lib/features/presence/jarvis_human_avatar_view.dart')
          content=view.read_text()
          assert content.count("'TRY FULL 3D AGAIN'")==1
          view.write_text(content.replace("'TRY FULL 3D AGAIN'","'RETRY JARVIS 3D'"))
          assert not any(x in p for x in heavy)
          print('SP545C profile: 32+64-bit support, lightweight 3D, original account and voice features')
          PY
          flutter pub get

      - name: Verify offline avatar scripts
        working-directory: jarvis_app
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import re
          import subprocess
          from pathlib import Path

          html = Path("assets/avatar/jarvis_human_avatar.html").read_text()
          scripts = re.findall(r"<script([^>]*)>(.*?)</script>", html, re.S | re.I)
          seen = {"importmap": 0, "module": 0, "inline": 0}
          for attrs, source in scripts:
              if 'importmap' in attrs:
                  mapping = json.loads(source)
                  assert mapping["imports"]["three"].startswith("../vendor/"), mapping
                  seen["importmap"] += 1
              else:
                  suffix = ".mjs" if 'type="module"' in attrs else ".js"
                  seen["module" if suffix == ".mjs" else "inline"] += 1
                  script_path = Path("/tmp/jarvis-avatar-check" + suffix)
                  script_path.write_text(source)
                  subprocess.run(["node", "--check", str(script_path)], check=True)
          assert seen == {"importmap": 1, "module": 1, "inline": 1}, seen
          print("Offline avatar JavaScript and import map syntax verified")
          PY

      - name: Analyze
        working-directory: jarvis_app
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Test spoken replies
        working-directory: jarvis_app
        timeout-minutes: 4
        run: |
          flutter test --reporter expanded test/jarvis_spoken_replies_test.dart

      - name: Test conversation avatar synchronization and phone safety
        working-directory: jarvis_app
        timeout-minutes: 5
        run: |
          flutter test --reporter expanded test/jarvis_avatar_voice_bridge_test.dart test/jarvis_autonomy_intents_test.dart test/jarvis_phone_safety_test.dart

      - name: Build Android ARMv7 plus ARM64 universal release
        working-directory: jarvis_app
        run: |
          set -euo pipefail
          flutter build apk --release --target-platform android-arm,android-arm64             --dart-define=JARVIS_HTTP_BASE="$JARVIS_HTTP_BASE"             --dart-define=GOOGLE_SERVER_CLIENT_ID="$GOOGLE_SERVER_CLIENT_ID"

      - name: Sign and validate final APK
        shell: bash
        run: |
          set -euo pipefail
          APKSIGNER="$(find "${ANDROID_HOME}/build-tools" -type f -name apksigner | sort -V | tail -1)"
          AAPT="$(find "${ANDROID_HOME}/build-tools" -type f -name aapt | sort -V | tail -1)"
          mkdir -p dist

          "$APKSIGNER" sign             --key /tmp/jarvis_signing/private-key.pk8             --cert /tmp/jarvis_signing/certificate.pem             --out dist/JARVIS-SP545C-ANDROID14-UNIVERSAL.apk             jarvis_app/build/app/outputs/flutter-apk/app-release.apk

          "$APKSIGNER" verify --verbose --print-certs             dist/JARVIS-SP545C-ANDROID14-UNIVERSAL.apk

          "$AAPT" dump badging dist/JARVIS-SP545C-ANDROID14-UNIVERSAL.apk             | tee dist/badging.txt
          grep "package: name='com.jarvis.project_jarvis'" dist/badging.txt
          # One APK must contain both supported ARM ABIs. A 64-bit CPU can
          # ship with a 32-bit Android userspace, so CPU specs alone are insufficient.
          grep "armeabi-v7a" dist/badging.txt
          grep "arm64-v8a" dist/badging.txt
          python3 - <<'PY'
          import zipfile
          with zipfile.ZipFile('dist/JARVIS-SP545C-ANDROID14-UNIVERSAL.apk') as z:
              files=set(z.namelist())
              for abi in ('armeabi-v7a','arm64-v8a'):
                  assert any(name.startswith('lib/'+abi+'/') and name.endswith('libflutter.so')
                             for name in files), 'Missing Flutter runtime for '+abi
              assert 'assets/flutter_assets/assets/models/CesiumMan.glb' in files
              assert not any('vitruvian_head.glb' in name for name in files)
              print('Both ARM runtimes and compact 3D model verified')
          PY
          grep "application-label:'JARVIS AI Assistant'" dist/badging.txt

          SHA1_COLON="$(openssl x509 -in /tmp/jarvis_signing/certificate.pem -noout -fingerprint -sha1 | sed 's/^sha1 Fingerprint=//I')"
          echo "ANDROID_PACKAGE=com.jarvis.project_jarvis" | tee dist/OAUTH-ANDROID-IDENTITY.txt
          echo "SIGNING_SHA1=${SHA1_COLON}" | tee -a dist/OAUTH-ANDROID-IDENTITY.txt
          sha256sum dist/JARVIS-SP545C-ANDROID14-UNIVERSAL.apk             | tee dist/JARVIS-SP545C-ANDROID14-UNIVERSAL.apk.sha256
          ls -lh dist/JARVIS-SP545C-ANDROID14-UNIVERSAL.apk

          rm -f /tmp/jarvis_signing/identity.json             /tmp/jarvis_signing/private-key.pem             /tmp/jarvis_signing/private-key.pk8

      - name: Upload final APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JARVIS-SP545C-ANDROID14-UNIVERSAL
          path: |
            dist/JARVIS-SP545C-ANDROID14-UNIVERSAL.apk
            dist/JARVIS-SP545C-ANDROID14-UNIVERSAL.apk.sha256
            dist/OAUTH-ANDROID-IDENTITY.txt
          compression-level: 0
          retention-days: 30

      - name: Publish final release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="jarvis-sp545c-universal-v1.3.14"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG"               dist/JARVIS-SP545C-ANDROID14-UNIVERSAL.apk               dist/JARVIS-SP545C-ANDROID14-UNIVERSAL.apk.sha256               dist/OAUTH-ANDROID-IDENTITY.txt               --clobber
          else
            gh release create "$TAG"               dist/JARVIS-SP545C-ANDROID14-UNIVERSAL.apk               dist/JARVIS-SP545C-ANDROID14-UNIVERSAL.apk.sha256               dist/OAUTH-ANDROID-IDENTITY.txt               --target "$GITHUB_SHA"               --title "JARVIS AI Assistant v1.3.14 - SP545C Android 14 Universal"               --notes "JARVIS AI Assistant 1.3.14 for SP545C Android 14: ARMv7 plus ARM64 universal APK; reduced GPU resolution and bundled compact animated 3D human instead of heavyweight models; owner login, spoken replies, memory, camera and device features remain available subject to device hardware and permissions; same permanent signing identity for compatible in-place update."
          fi
      # The integration tests also exercise socket/platform-channel behavior.
      # Run them after the signed APK is published so a hanging test runner
      # cannot prevent delivery of an otherwise verified Android build.
      - name: Test avatar and first-install account after publishing
        working-directory: jarvis_app
        timeout-minutes: 5
        continue-on-error: true
        run: |
          flutter test --reporter expanded test/jarvis_avatar_assets_test.dart test/jarvis_first_install_account_test.dart
