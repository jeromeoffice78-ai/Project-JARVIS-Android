name: Build JARVIS Fast Install

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-jarvis-fast-install.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 50

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter stable
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Generate Android clean-install package
        working-directory: jarvis_app
        run: |
          set -euo pipefail
          flutter create --platforms=android --org com.jeromeoffice .
          rm -f test/widget_test.dart
          python scripts/prepare_native.py
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path('android/app/src/main/AndroidManifest.xml')
          text = manifest.read_text()
          text = text.replace('android:label="project_jarvis"', 'android:label="JARVIS"')
          manifest.write_text(text)

          gradle = Path('android/app/build.gradle.kts')
          text = gradle.read_text()
          if 'useLegacyPackaging = true' not in text:
              text = text.replace(
                  'android {',
                  '''android {
              packaging {
                  jniLibs {
                      useLegacyPackaging = true
                  }
              }
          ''',
                  1,
              )
          gradle.write_text(text)
          PY

      - name: Bundle 3D avatar runtime assets
        working-directory: jarvis_app
        run: |
          set -euo pipefail
          mkdir -p assets/models assets/vendor/three/addons/loaders assets/vendor/three/addons/utils

          curl --fail --location --retry 5 --retry-delay 3 \
            https://raw.githubusercontent.com/KhronosGroup/glTF-Sample-Assets/main/Models/CesiumMan/glTF-Binary/CesiumMan.glb \
            --output assets/models/CesiumMan.glb

          curl --fail --location --retry 5 --retry-delay 3 \
            https://raw.githubusercontent.com/mrdoob/three.js/r180/build/three.module.js \
            --output assets/vendor/three/three.module.js
          curl --fail --location --retry 5 --retry-delay 3 \
            https://raw.githubusercontent.com/mrdoob/three.js/r180/examples/jsm/loaders/GLTFLoader.js \
            --output assets/vendor/three/addons/loaders/GLTFLoader.js
          curl --fail --location --retry 5 --retry-delay 3 \
            https://raw.githubusercontent.com/mrdoob/three.js/r180/examples/jsm/utils/BufferGeometryUtils.js \
            --output assets/vendor/three/addons/utils/BufferGeometryUtils.js

          curl --fail --location --retry 5 --retry-delay 3 \
            https://raw.githubusercontent.com/ibrews/VitruvianGodot/main/godot_project/vitruvian_body.glb \
            --output assets/models/vitruvian_body.glb
          curl --fail --location --retry 5 --retry-delay 3 \
            https://raw.githubusercontent.com/ibrews/VitruvianGodot/main/godot_project/vitruvian_head.glb \
            --output assets/models/vitruvian_head.glb
          curl --fail --location --retry 5 --retry-delay 3 \
            https://raw.githubusercontent.com/ibrews/VitruvianGodot/main/godot_project/hairtool_cards.glb \
            --output assets/models/hairtool_cards.glb

          for asset in vit_face_bc.png vit_mouth.png vit_sclera.png vit_iris.png vit_hair_atlas.png vit_hair_opacity.png; do
            curl --fail --location --retry 5 --retry-delay 3 \
              "https://raw.githubusercontent.com/ibrews/VitruvianGodot/main/godot_project/$asset" \
              --output "assets/models/$asset"
          done

          test "$(stat -c %s assets/models/vitruvian_body.glb)" -eq 6879364
          test "$(stat -c %s assets/models/vitruvian_head.glb)" -eq 10189832
          test "$(stat -c %s assets/models/hairtool_cards.glb)" -eq 14839096

          if [ -f assets/models/speaker_ecapa_xnnpack_fp32.pte ]; then
            echo "Speaker model must not be bundled in Fast Install."
            exit 1
          fi

          flutter pub get

      - name: Analyze
        working-directory: jarvis_app
        run: flutter analyze --no-fatal-warnings --no-fatal-infos

      - name: Build ARM64 release APK
        working-directory: jarvis_app
        env:
          JARVIS_HTTP_BASE: ${{ vars.JARVIS_HTTP_BASE }}
          JARVIS_WS_URL: ${{ vars.JARVIS_WS_URL }}
          JARVIS_CLIENT_TOKEN: ${{ secrets.JARVIS_CLIENT_TOKEN }}
        run: |
          set -euo pipefail
          HTTP_BASE="${JARVIS_HTTP_BASE:-https://project-jarvis-android.onrender.com}"
          WS_URL="${JARVIS_WS_URL:-wss://project-jarvis-android.onrender.com/ws/jarvis}"
          TOKEN="${JARVIS_CLIENT_TOKEN:-}"

          flutter build apk --release --target-platform android-arm64 \
            --dart-define=JARVIS_HTTP_BASE="$HTTP_BASE" \
            --dart-define=JARVIS_WS_URL="$WS_URL" \
            --dart-define=JARVIS_CLIENT_TOKEN="$TOKEN"

      - name: Validate and stage Fast Install APK
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          cp jarvis_app/build/app/outputs/flutter-apk/app-release.apk dist/JARVIS-FAST-INSTALL-ARM64.apk

          BUILD_TOOLS_DIR="$(find "${ANDROID_SDK_ROOT:-$ANDROID_HOME}/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"

          "$BUILD_TOOLS_DIR/apksigner" verify --verbose --print-certs dist/JARVIS-FAST-INSTALL-ARM64.apk

          if [ -x "$BUILD_TOOLS_DIR/aapt" ]; then
            "$BUILD_TOOLS_DIR/aapt" dump badging dist/JARVIS-FAST-INSTALL-ARM64.apk | tee dist/badging.txt
          else
            "$BUILD_TOOLS_DIR/aapt2" dump badging dist/JARVIS-FAST-INSTALL-ARM64.apk | tee dist/badging.txt
          fi

          grep "package: name='com.jeromeoffice.project_jarvis'" dist/badging.txt
          grep "native-code: 'arm64-v8a'" dist/badging.txt

          sha256sum dist/JARVIS-FAST-INSTALL-ARM64.apk | tee dist/JARVIS-FAST-INSTALL-ARM64.apk.sha256
          stat -c 'APK_BYTES=%s' dist/JARVIS-FAST-INSTALL-ARM64.apk
          ls -lh dist/JARVIS-FAST-INSTALL-ARM64.apk

      - name: Publish Fast Install APK
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          TAG="jarvis-fast-install-v1.3.0"
          NOTES="Optimized JARVIS ARM64 clean-install APK. The large speaker-identity AI model is no longer bundled; JARVIS downloads it with retry/resume support the first time voice identity is used."

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" \
              dist/JARVIS-FAST-INSTALL-ARM64.apk \
              dist/JARVIS-FAST-INSTALL-ARM64.apk.sha256 \
              --clobber
          else
            gh release create "$TAG" \
              dist/JARVIS-FAST-INSTALL-ARM64.apk \
              dist/JARVIS-FAST-INSTALL-ARM64.apk.sha256 \
              --target "${GITHUB_SHA}" \
              --title "JARVIS Fast Install - ARM64" \
              --notes "$NOTES"
          fi
