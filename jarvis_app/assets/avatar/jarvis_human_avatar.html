<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
    canvas{display:block;width:100%;height:100%;touch-action:none}
    #status{position:fixed;left:10px;top:8px;color:#9bd7ff;font:11px sans-serif;opacity:.72;pointer-events:none}
  
    #backup-avatar{display:none;position:absolute;inset:0;overflow:hidden;pointer-events:none;
      perspective:850px;align-items:center;justify-content:center;background:transparent}
    #backup-avatar.visible{display:flex}
    #backup-avatar .brand{display:block;width:min(142px,94%);height:auto;max-height:72%;object-fit:contain;
      border-radius:22px;filter:drop-shadow(0 0 15px #2db4ff90);animation:jarvis-presence 5s ease-in-out infinite}
    #backup-avatar .person{display:none;width:140px;height:255px;transform-style:preserve-3d;
      animation:jarvis-presence 5s ease-in-out infinite;position:relative;filter:drop-shadow(0 13px 15px #0009)}
    #backup-avatar .head{position:absolute;left:46px;top:11px;width:50px;height:63px;
      border-radius:43% 43% 46% 46%;background:radial-gradient(ellipse at 30% 25%,#d0a788,#8a5f48 74%,#543728);
      box-shadow:inset -11px -3px 14px #3d231b99,0 0 8px #5fc7ff38;transform:rotateY(-9deg)}
    #backup-avatar .hair{position:absolute;left:43px;top:5px;width:55px;height:24px;
      border-radius:50% 55% 25% 25%;background:linear-gradient(140deg,#302720,#080808)}
    #backup-avatar .eye{position:absolute;top:42px;width:5px;height:3px;background:#221a15;border-radius:50%}
    #backup-avatar .eye.left{left:58px}#backup-avatar .eye.right{left:80px}
    #backup-avatar .mouth{position:absolute;left:66px;top:59px;width:12px;height:2px;border-radius:100%;
      background:#43281d;transition:height .1s}
    #backup-avatar.speaking .mouth{height:7px;animation:jarvis-mouth .17s ease-in-out infinite alternate}
    #backup-avatar .torso{position:absolute;left:24px;top:77px;width:96px;height:104px;
      clip-path:polygon(20% 0,80% 0,100% 19%,83% 100%,17% 100%,0 19%);
      background:linear-gradient(105deg,#26374b,#080d17 65%,#131e30);
      border-top:3px solid #51dfff}
    #backup-avatar .arm{position:absolute;top:89px;width:23px;height:100px;border-radius:17px;
      background:linear-gradient(90deg,#263446,#090e18)}
    #backup-avatar .arm.left{left:8px;transform:rotate(9deg);transform-origin:top right}
    #backup-avatar .arm.right{right:7px;transform:rotate(-9deg);transform-origin:top left}
    #backup-avatar.speaking .arm.right{animation:jarvis-wave .65s ease-in-out infinite alternate}
    #backup-avatar .leg{position:absolute;top:176px;width:32px;height:88px;border-radius:0 0 8px 8px;
      background:linear-gradient(100deg,#1c2635,#070a0f)}
    #backup-avatar .leg.left{left:38px}#backup-avatar .leg.right{right:36px}
    #backup-avatar .caption{position:absolute;bottom:0;left:50%;transform:translateX(-50%);white-space:nowrap;
      font:11px system-ui;color:#9bd7ff;background:#07141ccc;padding:4px 8px;border-radius:8px}
    @keyframes jarvis-presence{0%,100%{transform:rotateY(-10deg) translateY(2px)}50%{transform:rotateY(11deg) translateY(-5px)}}
    @keyframes jarvis-mouth{to{height:3px}}
    @keyframes jarvis-wave{to{transform:rotate(-35deg);transform-origin:top left}}
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "../vendor/three/three.module.js",
      "three/addons/": "../vendor/three/addons/"
    }
  }
  </script>
</head>
<body>
<div id="status">Loading human JARVIS…</div>
<div id="backup-avatar" aria-label="JARVIS offline visual standby">
  <img id="jarvis-brand-backup" class="brand"
    src="../branding/jarvis_ai_assistant_brand_icon.png" alt="JARVIS AI Assistant logo"/>
  <div class="person">
    <div class="torso"></div><div class="arm left"></div><div class="arm right"></div>
    <div class="leg left"></div><div class="leg right"></div>
    <div class="head"></div><div class="hair"></div><div class="eye left"></div>
    <div class="eye right"></div><div class="mouth"></div>
  </div>
  <div class="caption">JARVIS · visual standby</div>
</div>
<script>
// Emergency visual backup: does not depend on the network, ES module support,
// GPU shaders, 3D model files, or the companion device-cloud connection.
(function(){
  const el=document.getElementById('backup-avatar');
  const image=document.getElementById('jarvis-brand-backup');
  image.addEventListener('error',()=>{
    image.style.display='none';
    el.querySelector('.person').style.display='block';
  });
  let shown=false;
  let backupReason='';
  // Floating overlays can deliver state before ES modules finish importing.
  window.jarvisSetState=function(next){
    if(next && typeof next==='object'){
      window.__jarvisPendingState=next;
      window.__jarvisAvatarBackup?.setState(next);
    }
  };
  window.__jarvisAvatarBackup={
    show:function(reason){
      if(shown)return;
      shown=true;backupReason=String(reason||'3D loading delay').slice(0,160);
      el.classList.add('visible');
      document.getElementById('status').textContent='JARVIS visual standby · 3D retry available';
      window.JarvisAvatar?.postMessage(JSON.stringify({
        type:'fallback',mode:'branded-visual',reason:backupReason
      }));
    },
    hide:function(){shown=false;el.classList.remove('visible');},
    setState:function(value){
      el.classList.toggle('speaking',value?.activity==='speaking');
      el.style.opacity=value?.active===false?'0.18':'1';
    }
  };
  // Large on-device GLB files can take >18 seconds to parse on a phone.
  // Present the approved lightweight brand art without treating that as
  // proof that the detailed renderer has failed.
  window.__jarvisAvatarWatchdog=setTimeout(()=>{
    if(!window.__jarvisDetailedModelReady)window.__jarvisAvatarBackup.show('3D loading slowly');
  },18000);
  addEventListener('unhandledrejection',event=>{
    if(!window.__jarvisDetailedModelReady){
      const msg=String(event.reason?.message||event.reason||'JavaScript rejected').slice(0,160);
      window.JarvisAvatar?.postMessage(JSON.stringify({type:'diagnostic',message:msg}));
    }
  });
  addEventListener('error',function(event){
    const name=event.filename||event.target?.src||'';
    if(!window.__jarvisDetailedModelReady && (/three\.module|GLTFLoader|WebGL/.test(name))) {
      window.JarvisAvatar?.postMessage(JSON.stringify({
        type:'diagnostic',message:'3D module failed: '+String(name).slice(0,140)
      }));
      window.__jarvisAvatarBackup.show('3D module load failed');
    }
  },true);
})();
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const status = document.getElementById('status');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(31, innerWidth/innerHeight, .01, 100);
camera.position.set(0, 1.55, 4.5);
camera.lookAt(0, 1.2, 0);

// Favor compatible settings on midrange Android phones; the full human
// meshes already carry their own surface detail, so MSAA is optional.
const renderer = new THREE.WebGLRenderer({antialias:false, alpha:true, powerPreference:'default'});
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.shadowMap.enabled = false;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const hemi = new THREE.HemisphereLight(0xcfe7ff, 0x101018, 1.1);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xffe1c7, 3.0);
key.position.set(-2.2, 3.8, 3.2);
key.castShadow = true;
scene.add(key);
const rim = new THREE.DirectionalLight(0x6a9cff, 2.4);
rim.position.set(3.0, 2.6, -2.0);
scene.add(rim);
const fill = new THREE.DirectionalLight(0xffffff, .7);
fill.position.set(0, 1.2, 4);
scene.add(fill);

const loader = new GLTFLoader();
const texLoader = new THREE.TextureLoader();
const root = new THREE.Group();
scene.add(root);

let body=null, head=null, hair=null, mixer=null, headBone=null, headPivot=null;
let leftUpperArm=null,rightUpperArm=null,leftUpperLeg=null,rightUpperLeg=null;
let morphMeshes=[];
let actions={};
let activeAction=null;
let ready=false;
let targetX=0;
let nextWander=performance.now()+5000;
let blinkStart=-1;
let nextBlink=performance.now()+1200+Math.random()*2200;
let lastActive=true;
let speakingPhase=0;
let groundY=0;
let fallbackMouth=null;

const state={
  active:true,
  activity:'idle',
  mood:'confident',
  connected:false,
  companion:false,
  transcript:'',
  audioLevel:0,
  audioLevelAvailable:false
};

function asset(rel){
  return new URL('../models/'+rel, window.location.href).href;
}

function texture(rel, srgb=true){
  const t=texLoader.load(asset(rel));
  if(srgb) t.colorSpace=THREE.SRGBColorSpace;
  t.flipY=false;
  return t;
}

const faceBC=texture('vit_face_bc.png',true);
const mouthTex=texture('vit_mouth.png',true);
const scleraTex=texture('vit_sclera.png',true);
const irisTex=texture('vit_iris.png',true);
const hairAtlas=texture('vit_hair_atlas.png',true);
const hairOpacity=texture('vit_hair_opacity.png',false);

const skinMat=new THREE.MeshStandardMaterial({
  map:faceBC, color:0xffffff, roughness:.5, metalness:0
});
const mouthMat=new THREE.MeshStandardMaterial({
  map:mouthTex, color:0xffffff, roughness:.58
});
const scleraMat=new THREE.MeshStandardMaterial({
  map:scleraTex, color:0xffffff, roughness:.34
});
const irisMat=new THREE.MeshStandardMaterial({
  map:irisTex, color:0xffffff, roughness:.3
});
const corneaMat=new THREE.MeshPhysicalMaterial({
  color:0xffffff, roughness:.06, transmission:.05,
  transparent:true, opacity:.35, depthWrite:false
});
const hairMat=new THREE.MeshStandardMaterial({
  map:hairAtlas, alphaMap:hairOpacity, color:0x17130f,
  roughness:.55, transparent:true, alphaTest:.22, side:THREE.DoubleSide
});

function materialName(m){return (m?.name||'').split('.')[0];}
function configureHead(node){
  node.traverse(o=>{
    if(!o.isMesh) return;
    o.castShadow=true; o.receiveShadow=true;
    if(o.morphTargetDictionary && Object.keys(o.morphTargetDictionary).length){
      morphMeshes.push(o);
    }
    const multi=Array.isArray(o.material);
    const mats=multi?o.material:[o.material];
    const mapped=mats.map(m=>{
      const n=materialName(m);
      if(n==='VitSkin' || n.includes('Skin')) return skinMat;
      if(n==='VitMouth' || n.includes('Mouth')) return mouthMat;
      if(n==='VitSclera') return scleraMat;
      if(n==='VitIris') return irisMat;
      if(n.includes('Cornea') || n.includes('Tearline')) return corneaMat;
      if(n.includes('Scalp')) return new THREE.MeshStandardMaterial({color:0x2a1d15,roughness:.8});
      return m || skinMat;
    });
    o.material=multi?mapped:mapped[0];
  });
}
function configureBody(node){
  node.traverse(o=>{
    if(!o.isMesh) return;
    o.castShadow=true; o.receiveShadow=true;
    const multi=Array.isArray(o.material);
    const mats=multi?o.material:[o.material];
    const mapped=mats.map(m=>{
      const n=materialName(m);
      if(n.includes('Shirt')) return new THREE.MeshStandardMaterial({color:0x111827,roughness:.72});
      if(n.includes('Pants')) return new THREE.MeshStandardMaterial({color:0x0b0f16,roughness:.78});
      if(n.includes('Shoes')) return new THREE.MeshStandardMaterial({color:0x090909,roughness:.45});
      return new THREE.MeshStandardMaterial({color:0x825f4a,roughness:.62});
    });
    o.material=multi?mapped:mapped[0];
  });
}
function configureHair(node){
  node.traverse(o=>{
    if(o.isMesh){
      o.material=hairMat;
      o.castShadow=true;
    }
  });
}
function findByContains(node, text){
  let found=null;
  node.traverse(o=>{
    if(!found && (o.name||'').toLowerCase().includes(text.toLowerCase())) found=o;
  });
  return found;
}
function morph(name,value){
  for(const mesh of morphMeshes){
    const i=mesh.morphTargetDictionary?.[name];
    if(i!==undefined && mesh.morphTargetInfluences) mesh.morphTargetInfluences[i]=THREE.MathUtils.clamp(value,0,1);
  }
}
function clearFace(){
  const names=['Happy','Sad','Angry','Scared','Thinking','Smile_Lips_Closed',
    'Eyebrows_Raised_Left','Eyebrows_Raised_Right','Eyebrows_Frown_Left','Eyebrows_Frown_Right',
    'Eyes_Closed_Max','Eyes_Squint','Mouth_Large_Opened','Jaw_Lower',
    'aa_02','ow_08','p_b_m_21','f_v_18','ey_eh_uh_04'];
  for(const n of names) morph(n,0);
}
function expression(t){
  const blink = blinkValue(t);
  clearFace();
  morph('Eyes_Closed_Max',blink);

  const mood=state.mood;
  if(state.companion || mood==='companion' || mood==='warm'){
    morph('Happy',.18); morph('Smile_Lips_Closed',.14);
  }else if(mood==='serious'){
    morph('Eyebrows_Frown_Left',.22); morph('Eyebrows_Frown_Right',.22); morph('Eyes_Squint',.1);
  }else if(mood==='focused'){
    morph('Thinking',.2); morph('Eyes_Squint',.12);
  }else if(mood==='energetic'){
    morph('Happy',.34); morph('Eyebrows_Raised_Left',.2); morph('Eyebrows_Raised_Right',.2);
  }else if(mood==='intense'){
    morph('Angry',.2); morph('Eyebrows_Frown_Left',.28); morph('Eyebrows_Frown_Right',.28);
  }else{
    morph('Smile_Lips_Closed',.05);
  }

  if(state.activity==='thinking'){
    morph('Thinking',.35);
  }

  if(state.activity==='speaking'){
    speakingPhase += .17;

    const fallbackOpen =
      .16 + Math.abs(Math.sin(speakingPhase*1.9))*.42;

    const rawLevel = Number.isFinite(state.audioLevel)
      ? THREE.MathUtils.clamp(state.audioLevel,0,1)
      : 0;

    const audioOpen = state.audioLevelAvailable
      ? THREE.MathUtils.clamp(
          Math.pow(rawLevel, .55) * 1.75,
          0,
          .88
        )
      : fallbackOpen;

    const open = state.audioLevelAvailable
      ? audioOpen
      : fallbackOpen;

    morph('Mouth_Large_Opened',open);
    morph('Jaw_Lower',open*.56);

    const slot=Math.floor((t/105)%5);
    const visemeStrength = state.audioLevelAvailable
      ? THREE.MathUtils.clamp(open*.62, .04, .52)
      : .22+.18*Math.abs(Math.sin(speakingPhase));

    morph(
      ['aa_02','ow_08','p_b_m_21','f_v_18','ey_eh_uh_04'][slot],
      visemeStrength
    );
  }
}
function blinkValue(now){
  if(blinkStart<0 && now>=nextBlink){
    blinkStart=now;
  }
  if(blinkStart>=0){
    const d=now-blinkStart;
    if(d<95) return d/95;
    if(d<210) return 1-(d-95)/115;
    blinkStart=-1;
    nextBlink=now+2200+Math.random()*4200;
  }
  return 0;
}
function playClip(preferred,fade=.28){
  if(!mixer) return;
  const candidates=[preferred, preferred.toLowerCase(), preferred.toUpperCase()];
  let action=null;
  for(const key of Object.keys(actions)){
    if(candidates.some(c=>key.toLowerCase()===c.toLowerCase())) {action=actions[key];break;}
  }
  if(!action){
    if(preferred==='Sway') action=actions['Idle']||Object.values(actions)[0];
    if(preferred==='Wave') action=actions['Sway']||actions['Idle']||Object.values(actions)[0];
  }
  if(!action || action===activeAction) return;
  action.reset().fadeIn(fade).play();
  if(activeAction) activeAction.fadeOut(fade);
  activeAction=action;
}
function scheduleWander(now){
  nextWander=now+6500+Math.random()*9000;
  targetX=-.72+Math.random()*1.44;
}
function attachWorldAuthored(child,bone){
  bone.updateWorldMatrix(true,false);
  const inv=bone.matrixWorld.clone().invert();
  child.applyMatrix4(inv);
  bone.add(child);
}
function fitCamera(){
  const box=new THREE.Box3().setFromObject(root);
  const center=box.getCenter(new THREE.Vector3());
  const size=box.getSize(new THREE.Vector3());
  const h=Math.max(size.y,1);
  root.position.y-=box.min.y;
  groundY=root.position.y;
  camera.position.set(0,h*.58,Math.max(3.0,h*1.55));
  camera.lookAt(0,h*.54,0);
}
function buildSimplified3DHuman(){
  // Keep a moving THREE.js figure available even when the downloaded GLB
  // model or textures cannot be decoded on a particular Android WebView.
  body=new THREE.Group();
  const skin=new THREE.MeshStandardMaterial({color:0x9e765c,roughness:.8});
  const hairColor=new THREE.MeshStandardMaterial({color:0x191513,roughness:.9});
  const shirt=new THREE.MeshStandardMaterial({color:0x101b2c,roughness:.55});
  const pants=new THREE.MeshStandardMaterial({color:0x151b24,roughness:.8});
  const eye=new THREE.MeshStandardMaterial({color:0x14100e});
  const mouthMat=new THREE.MeshStandardMaterial({color:0x462a29});
  const mesh=(geo,mat,x,y,z)=>{const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);body.add(m);return m;};
  mesh(new THREE.CylinderGeometry(.24,.18,.85,16),shirt,0,1.14,0);
  mesh(new THREE.CylinderGeometry(.095,.11,.22,12),skin,0,1.65,0);
  mesh(new THREE.SphereGeometry(.22,16,12),skin,0,1.83,0);
  mesh(new THREE.SphereGeometry(.227,16,12,0,Math.PI*2,0,Math.PI*.34),hairColor,0,1.91,0);
  mesh(new THREE.SphereGeometry(.019,8,6),eye,-.084,1.845,.188);
  mesh(new THREE.SphereGeometry(.019,8,6),eye,.084,1.845,.188);
  fallbackMouth=mesh(new THREE.SphereGeometry(.042,8,6),mouthMat,0,1.741,.205);
  fallbackMouth.scale.y=.2;
  for(const side of [-1,1]){
    mesh(new THREE.CylinderGeometry(.079,.061,.7,12),shirt,side*.315,1.18,0).rotation.z=side*.18;
    mesh(new THREE.CylinderGeometry(.11,.085,.87,12),pants,side*.112,.43,0);
    mesh(new THREE.BoxGeometry(.20,.105,.35),hairColor,side*.11,.055,.12);
  }
  root.add(body);
  fitCamera();
  ready=true;
  window.__jarvisDetailedModelReady=true;
  clearTimeout(window.__jarvisAvatarWatchdog);
  window.__jarvisAvatarBackup?.hide();
  status.textContent='JARVIS simplified 3D mode';
  window.JarvisAvatar?.postMessage(JSON.stringify({type:'ready',mode:'simplified-3d'}));
}
async function load(){
  try{
    // Avoid decoding three large models simultaneously in Android WebView.
    // These assets total >30 MB before meshes are expanded in GPU memory.
    let stage='body';
    let b,h,hr;
    try{
      b=await loader.loadAsync(asset('vitruvian_body.glb'));
      stage='head';
      h=await loader.loadAsync(asset('vitruvian_head.glb'));
      stage='hair';
      hr=await loader.loadAsync(asset('hairtool_cards.glb'));
    }catch(modelError){
      throw new Error('Unable to load '+stage+' model: '+
        String(modelError?.message||modelError));
    }
    body=b.scene; head=h.scene; hair=hr.scene;
    configureBody(body); configureHead(head); configureHair(hair);
    root.add(body);
    body.updateMatrixWorld(true);

    headBone=findByContains(body,'mixamorig_Head')||findByContains(body,'Head');
    leftUpperArm=findByContains(body,'LeftArm');
    rightUpperArm=findByContains(body,'RightArm');
    leftUpperLeg=findByContains(body,'LeftUpLeg');
    rightUpperLeg=findByContains(body,'RightUpLeg');

    if(headBone){
      headPivot=new THREE.Group();
      headPivot.name='JarvisHeadLookPivot';
      headBone.add(headPivot);
      headPivot.position.set(0,0,0);
      headPivot.rotation.set(0,0,0);
      headPivot.scale.set(1,1,1);
      headPivot.updateWorldMatrix(true,false);
      attachWorldAuthored(head,headPivot);
      attachWorldAuthored(hair,headPivot);
    }else{
      root.add(head); root.add(hair);
    }

    mixer=new THREE.AnimationMixer(body);
    for(const clip of b.animations){
      actions[clip.name]=mixer.clipAction(clip);
      actions[clip.name].setLoop(THREE.LoopRepeat,Infinity);
    }
    playClip('Idle',0);
    fitCamera();
    ready=true;
    window.__jarvisDetailedModelReady=true;
    clearTimeout(window.__jarvisAvatarWatchdog);
    window.__jarvisAvatarBackup?.hide();
    status.textContent='Human JARVIS online';
    setTimeout(()=>status.style.opacity='0',1800);
    window.JarvisAvatar?.postMessage(JSON.stringify({type:'ready'}));
  }catch(e){
    console.error(e);
    window.JarvisAvatar?.postMessage(JSON.stringify({
      type:'diagnostic',message:String(e?.message||e).slice(0,160)
    }));
    try {
      buildSimplified3DHuman();
    } catch(fallbackError) {
      window.__jarvisAvatarBackup?.show('3D model and renderer unavailable');
    }
  }
}
load();

function autonomousMotion(now,dt){
  if(!ready) return;
  if(state.active!==lastActive){
    if(state.active){
      root.position.x=-1.55;
      targetX=-.25+Math.random()*.5;
      playClip('Walk');
    }else{
      targetX=1.7;
      playClip('Walk');
    }
    lastActive=state.active;
  }

  if(state.active && now>=nextWander && state.activity!=='speaking'){
    scheduleWander(now);
  }

  const dx=targetX-root.position.x;
  const moving=Math.abs(dx)>.025;
  if(moving){
    root.position.x += Math.sign(dx)*Math.min(Math.abs(dx),dt*.48);
    root.rotation.y=THREE.MathUtils.lerp(root.rotation.y, dx>0?.10:-.10, .08);
    playClip('Walk');
  }else{
    root.rotation.y=THREE.MathUtils.lerp(root.rotation.y,0,.06);
    if(state.activity==='speaking'){
      playClip(Math.sin(now*.0017)>.72?'Wave':'Sway');
    }else if(state.activity==='thinking'){
      playClip('Turn');
    }else{
      playClip(Math.sin(now*.00034)>.35?'Sway':'Idle');
    }
  }

  if(headPivot){
    const yaw=.035*Math.sin(now*.00072) + (state.activity==='thinking'?.055:0);
    const pitch=.018*Math.sin(now*.00105);
    const nod=state.activity==='speaking' ? .016*Math.sin(now*.0048) : 0;
    headPivot.rotation.set(pitch+nod,yaw,0);
  }

  // The body GLB includes a real Walk clip. Add only a subtle root bob here so
  // locomotion reads as grounded without accumulating rotations on skeleton bones.
  if(moving){
    root.position.y=groundY+Math.abs(Math.sin(now*.008))*0.012;
  }else{
    root.position.y=THREE.MathUtils.lerp(root.position.y,groundY,.18);
  }
}
const clock=new THREE.Clock();
function animate(now){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.05);
  if(mixer) mixer.update(dt);
  autonomousMotion(now,dt);
  expression(now);
  if(fallbackMouth){
    const speaking=state.activity==='speaking';
    fallbackMouth.scale.y=speaking
      ? .35 + Math.abs(Math.sin(now*.018))*.75 : .18;
  }
  renderer.render(scene,camera);
}
requestAnimationFrame(animate);

window.jarvisSetState=(next)=>{
  if(!next||typeof next!=='object') return;
  Object.assign(state,next);
  window.__jarvisAvatarBackup?.setState(state);
  window.__jarvisPendingState=next;
  if(next.active===true && !lastActive){
    root.visible=true;
  }
};

// Apply the state supplied while the module and 3D models were still loading.
if(window.__jarvisPendingState)window.jarvisSetState(window.__jarvisPendingState);

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
