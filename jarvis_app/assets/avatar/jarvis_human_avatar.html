<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
  <style>
    html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent}
    canvas{display:block;width:100%;height:100%;touch-action:none}
    #status{position:fixed;left:10px;top:8px;color:#9bd7ff;font:11px sans-serif;opacity:.72;pointer-events:none}
  </style>
  <script type="importmap">
  {
    "imports": {
      "three": "./vendor/three.module.js",
      "three/addons/": "./vendor/"
    }
  }
  </script>
</head>
<body>
<div id="status">Loading human JARVIS…</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const status = document.getElementById('status');
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(31, innerWidth/innerHeight, .01, 100);
camera.position.set(0, 1.55, 4.5);
camera.lookAt(0, 1.2, 0);

const renderer = new THREE.WebGLRenderer({antialias:true, alpha:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.12;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const hemi = new THREE.HemisphereLight(0xcfe7ff, 0x101018, 1.1);
scene.add(hemi);
const key = new THREE.DirectionalLight(0xffe1c7, 3.0);
key.position.set(-2.2, 3.8, 3.2);
key.castShadow = true;
scene.add(key);
const rim = new THREE.DirectionalLight(0x6a9cff, 2.4);
rim.position.set(3.0, 2.6, -2.0);
scene.add(rim);
const fill = new THREE.DirectionalLight(0xffffff, .7);
fill.position.set(0, 1.2, 4);
scene.add(fill);

const loader = new GLTFLoader();
const texLoader = new THREE.TextureLoader();
const root = new THREE.Group();
scene.add(root);

let body=null, head=null, hair=null, mixer=null, headBone=null;
let leftUpperArm=null,rightUpperArm=null,leftUpperLeg=null,rightUpperLeg=null;
let morphMeshes=[];
let actions={};
let activeAction=null;
let ready=false;
let targetX=0;
let nextWander=performance.now()+5000;
let blinkStart=-1;
let nextBlink=performance.now()+1200+Math.random()*2200;
let lastActive=true;
let speakingPhase=0;

const state={
  active:true,
  activity:'idle',
  mood:'confident',
  connected:false,
  companion:false,
  transcript:''
};

function asset(rel){
  return new URL('../models/'+rel, window.location.href).href;
}

function texture(rel, srgb=true){
  const t=texLoader.load(asset(rel));
  if(srgb) t.colorSpace=THREE.SRGBColorSpace;
  t.flipY=false;
  return t;
}

const faceBC=texture('vit_face_bc.png',true);
const mouthTex=texture('vit_mouth.png',true);
const scleraTex=texture('vit_sclera.png',true);
const irisTex=texture('vit_iris.png',true);
const hairAtlas=texture('vit_hair_atlas.png',true);
const hairOpacity=texture('vit_hair_opacity.png',false);

const skinMat=new THREE.MeshStandardMaterial({
  map:faceBC, color:0xffffff, roughness:.5, metalness:0
});
const mouthMat=new THREE.MeshStandardMaterial({
  map:mouthTex, color:0xffffff, roughness:.58
});
const scleraMat=new THREE.MeshStandardMaterial({
  map:scleraTex, color:0xffffff, roughness:.34
});
const irisMat=new THREE.MeshStandardMaterial({
  map:irisTex, color:0xffffff, roughness:.3
});
const corneaMat=new THREE.MeshPhysicalMaterial({
  color:0xffffff, roughness:.06, transmission:.05,
  transparent:true, opacity:.35, depthWrite:false
});
const hairMat=new THREE.MeshStandardMaterial({
  map:hairAtlas, alphaMap:hairOpacity, color:0x17130f,
  roughness:.55, transparent:true, alphaTest:.22, side:THREE.DoubleSide
});

function materialName(m){return (m?.name||'').split('.')[0];}
function configureHead(node){
  node.traverse(o=>{
    if(!o.isMesh) return;
    o.castShadow=true; o.receiveShadow=true;
    if(o.morphTargetDictionary && Object.keys(o.morphTargetDictionary).length){
      morphMeshes.push(o);
    }
    const mats=Array.isArray(o.material)?o.material:[o.material];
    o.material=mats.map(m=>{
      const n=materialName(m);
      if(n==='VitSkin' || n.includes('Skin')) return skinMat;
      if(n==='VitMouth' || n.includes('Mouth')) return mouthMat;
      if(n==='VitSclera') return scleraMat;
      if(n==='VitIris') return irisMat;
      if(n.includes('Cornea') || n.includes('Tearline')) return corneaMat;
      if(n.includes('Scalp')) return new THREE.MeshStandardMaterial({color:0x2a1d15,roughness:.8});
      return m || skinMat;
    });
    if(!Array.isArray(o.material)) o.material=o.material[0];
  });
}
function configureBody(node){
  node.traverse(o=>{
    if(!o.isMesh) return;
    o.castShadow=true; o.receiveShadow=true;
    const mats=Array.isArray(o.material)?o.material:[o.material];
    o.material=mats.map(m=>{
      const n=materialName(m);
      if(n.includes('Shirt')) return new THREE.MeshStandardMaterial({color:0x111827,roughness:.72});
      if(n.includes('Pants')) return new THREE.MeshStandardMaterial({color:0x0b0f16,roughness:.78});
      if(n.includes('Shoes')) return new THREE.MeshStandardMaterial({color:0x090909,roughness:.45});
      return new THREE.MeshStandardMaterial({color:0x825f4a,roughness:.62});
    });
    if(!Array.isArray(o.material)) o.material=o.material[0];
  });
}
function configureHair(node){
  node.traverse(o=>{
    if(o.isMesh){
      o.material=hairMat;
      o.castShadow=true;
    }
  });
}
function findByContains(node, text){
  let found=null;
  node.traverse(o=>{
    if(!found && (o.name||'').toLowerCase().includes(text.toLowerCase())) found=o;
  });
  return found;
}
function morph(name,value){
  for(const mesh of morphMeshes){
    const i=mesh.morphTargetDictionary?.[name];
    if(i!==undefined && mesh.morphTargetInfluences) mesh.morphTargetInfluences[i]=THREE.MathUtils.clamp(value,0,1);
  }
}
function clearFace(){
  const names=['Happy','Sad','Angry','Scared','Thinking','Smile_Lips_Closed',
    'Eyebrows_Raised_Left','Eyebrows_Raised_Right','Eyebrows_Frown_Left','Eyebrows_Frown_Right',
    'Eyes_Closed_Max','Eyes_Squint','Mouth_Large_Opened','Jaw_Lower',
    'aa_02','ow_08','p_b_m_21','f_v_18','ey_eh_uh_04'];
  for(const n of names) morph(n,0);
}
function expression(t){
  const blink = blinkValue(t);
  clearFace();
  morph('Eyes_Closed_Max',blink);

  const mood=state.mood;
  if(state.companion || mood==='companion' || mood==='warm'){
    morph('Happy',.18); morph('Smile_Lips_Closed',.14);
  }else if(mood==='serious'){
    morph('Eyebrows_Frown_Left',.22); morph('Eyebrows_Frown_Right',.22); morph('Eyes_Squint',.1);
  }else if(mood==='focused'){
    morph('Thinking',.2); morph('Eyes_Squint',.12);
  }else if(mood==='energetic'){
    morph('Happy',.34); morph('Eyebrows_Raised_Left',.2); morph('Eyebrows_Raised_Right',.2);
  }else if(mood==='intense'){
    morph('Angry',.2); morph('Eyebrows_Frown_Left',.28); morph('Eyebrows_Frown_Right',.28);
  }else{
    morph('Smile_Lips_Closed',.05);
  }

  if(state.activity==='thinking'){
    morph('Thinking',.35);
  }

  if(state.activity==='speaking'){
    speakingPhase += .17;
    const open=.16 + Math.abs(Math.sin(speakingPhase*1.9))*.42;
    morph('Mouth_Large_Opened',open);
    morph('Jaw_Lower',open*.5);
    const slot=Math.floor((t/120)%5);
    morph(['aa_02','ow_08','p_b_m_21','f_v_18','ey_eh_uh_04'][slot], .22+.18*Math.abs(Math.sin(speakingPhase)));
  }
}
function blinkValue(now){
  if(blinkStart<0 && now>=nextBlink){
    blinkStart=now;
  }
  if(blinkStart>=0){
    const d=now-blinkStart;
    if(d<95) return d/95;
    if(d<210) return 1-(d-95)/115;
    blinkStart=-1;
    nextBlink=now+2200+Math.random()*4200;
  }
  return 0;
}
function playClip(preferred,fade=.28){
  if(!mixer) return;
  const candidates=[preferred, preferred.toLowerCase(), preferred.toUpperCase()];
  let action=null;
  for(const key of Object.keys(actions)){
    if(candidates.some(c=>key.toLowerCase()===c.toLowerCase())) {action=actions[key];break;}
  }
  if(!action){
    if(preferred==='Sway') action=actions['Idle']||Object.values(actions)[0];
    if(preferred==='Wave') action=actions['Sway']||actions['Idle']||Object.values(actions)[0];
  }
  if(!action || action===activeAction) return;
  action.reset().fadeIn(fade).play();
  if(activeAction) activeAction.fadeOut(fade);
  activeAction=action;
}
function scheduleWander(now){
  nextWander=now+6500+Math.random()*9000;
  targetX=-.72+Math.random()*1.44;
}
function attachWorldAuthored(child,bone){
  bone.updateWorldMatrix(true,false);
  const inv=bone.matrixWorld.clone().invert();
  child.applyMatrix4(inv);
  bone.add(child);
}
function fitCamera(){
  const box=new THREE.Box3().setFromObject(root);
  const center=box.getCenter(new THREE.Vector3());
  const size=box.getSize(new THREE.Vector3());
  const h=Math.max(size.y,1);
  root.position.y-=box.min.y;
  camera.position.set(0,h*.58,Math.max(3.0,h*1.55));
  camera.lookAt(0,h*.54,0);
}
async function load(){
  try{
    const [b,h,hr]=await Promise.all([
      loader.loadAsync(asset('vitruvian_body.glb')),
      loader.loadAsync(asset('vitruvian_head.glb')),
      loader.loadAsync(asset('hairtool_cards.glb'))
    ]);
    body=b.scene; head=h.scene; hair=hr.scene;
    configureBody(body); configureHead(head); configureHair(hair);
    root.add(body);
    body.updateMatrixWorld(true);

    headBone=findByContains(body,'mixamorig_Head')||findByContains(body,'Head');
    leftUpperArm=findByContains(body,'LeftArm');
    rightUpperArm=findByContains(body,'RightArm');
    leftUpperLeg=findByContains(body,'LeftUpLeg');
    rightUpperLeg=findByContains(body,'RightUpLeg');

    if(headBone){
      attachWorldAuthored(head,headBone);
      attachWorldAuthored(hair,headBone);
    }else{
      root.add(head); root.add(hair);
    }

    mixer=new THREE.AnimationMixer(body);
    for(const clip of b.animations){
      actions[clip.name]=mixer.clipAction(clip);
      actions[clip.name].setLoop(THREE.LoopRepeat,Infinity);
    }
    playClip('Idle',0);
    fitCamera();
    ready=true;
    status.textContent='Human JARVIS online';
    setTimeout(()=>status.style.opacity='0',1800);
    window.JarvisAvatar?.postMessage(JSON.stringify({type:'ready'}));
  }catch(e){
    console.error(e);
    status.textContent='Human avatar load failed';
    window.JarvisAvatar?.postMessage(JSON.stringify({type:'error',message:String(e)}));
  }
}
load();

function autonomousMotion(now,dt){
  if(!ready) return;
  if(state.active!==lastActive){
    if(state.active){
      root.position.x=-1.55;
      targetX=-.25+Math.random()*.5;
      playClip('Walk');
    }else{
      targetX=1.7;
      playClip('Walk');
    }
    lastActive=state.active;
  }

  if(state.active && now>=nextWander && state.activity!=='speaking'){
    scheduleWander(now);
  }

  const dx=targetX-root.position.x;
  const moving=Math.abs(dx)>.025;
  if(moving){
    root.position.x += Math.sign(dx)*Math.min(Math.abs(dx),dt*.48);
    root.rotation.y=THREE.MathUtils.lerp(root.rotation.y, dx>0?.10:-.10, .08);
    playClip('Walk');
  }else{
    root.rotation.y=THREE.MathUtils.lerp(root.rotation.y,0,.06);
    if(state.activity==='speaking'){
      playClip(Math.sin(now*.0017)>.72?'Wave':'Sway');
    }else if(state.activity==='thinking'){
      playClip('Turn');
    }else{
      playClip(Math.sin(now*.00034)>.35?'Sway':'Idle');
    }
  }

  if(headBone){
    const yaw=.035*Math.sin(now*.00072) + (state.activity==='thinking'?.055:0);
    const pitch=.018*Math.sin(now*.00105);
    headBone.rotation.y += yaw;
    headBone.rotation.x += pitch;
  }
  if(state.activity==='speaking'){
    const g=.05*Math.sin(now*.004);
    if(leftUpperArm) leftUpperArm.rotation.z += g;
    if(rightUpperArm) rightUpperArm.rotation.z -= g*.7;
  }
}
const clock=new THREE.Clock();
function animate(now){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.05);
  if(mixer) mixer.update(dt);
  autonomousMotion(now,dt);
  expression(now);
  renderer.render(scene,camera);
}
requestAnimationFrame(animate);

window.jarvisSetState=(next)=>{
  if(!next||typeof next!=='object') return;
  Object.assign(state,next);
  if(next.active===true && !lastActive){
    root.visible=true;
  }
};

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});
</script>
</body>
</html>
