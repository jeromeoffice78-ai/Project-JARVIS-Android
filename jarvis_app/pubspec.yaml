name: project_jarvis
description: Project Jarvis multimodal AI command center.
publish_to: "none"
version: 1.2.0+3

environment:
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  web_socket_channel: ^3.0.3
  torch_light: ^2.0.0
  http: ^1.6.0
  camera: ^0.12.0+2
  google_mlkit_face_detection: ^0.15.1
  audio_session: ^0.2.4
  geolocator: ^14.0.3
  url_launcher: ^6.3.2
  device_calendar: ^4.3.3
  health: ^13.3.2
  shared_preferences: ^2.5.5
  timezone: ^0.9.4
  permission_handler: ^12.0.3
  flutter_tts: ^4.2.5
  speech_to_text: ^7.4.0
  universal_ble: ^2.3.0
  file_picker: ^13.1.0
  flutter_webrtc: ^1.6.2+hotfix.3
  model_viewer_plus: ^1.10.0
  youtube_player_iframe: ^6.0.2
  share_plus: ^13.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/models/speaker_ecapa_xnnpack_fp32.pte
    - assets/models/SPEAKER-ECAPA-LICENSE.md
    - assets/models/CesiumMan.glb
    - assets/models/CesiumMan-LICENSE.md
